# fly.toml app configuration file generated for leilao-de-times on 2026-11-04T05:31:27Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'leilao-de-times'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = 'stop'
  auto_start_machines = false
  min_machines_running = 0
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/', timeout = '5s' }]
  concurrency = { hard_limit = 1000, soft_limit = 800, type = 'connections' }

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'

[mounts]
  source = "galera_dados"
  destination = "/data"

[env]
  DB_PATH = "/data/galera.db"
