# Configuração do Fly.io — veja DEPLOY-FLY.md para o passo a passo
app = 'leilao-de-times'
primary_region = 'gru' # São Paulo: menor ping para quem joga no Brasil

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Desliga a máquina quando ninguém está conectado (economiza dinheiro)
  # e liga sozinha quando alguém abre o site (demora ~2s na primeira vez)
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

# o disco que não some a cada deploy: o banco de dados (bd.js) mora nele. O volume foi criado com
#   fly volumes create galera_dados --region gru --size 1
[mounts]
  source = "galera_dados"
  destination = "/data"

[env]
  DB_PATH = "/data/galera.db"
