# fly.toml app configuration file generated for leilao-de-times on 2026-10-01T17:46:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'leilao-de-times'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'

# o disco que não some a cada deploy: o banco de dados (bd.js) mora nele. O volume foi criado com
#   fly volumes create galera_dados --region gru --size 1
[mounts]
  source = "galera_dados"
  destination = "/data"

[env]
  DB_PATH = "/data/galera.db"
