<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Corrida da Galera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* box de corrida: fibra de carbono, placa de box com letras amarelas e a faixa quadriculada */
  --bg:#0d0e12;--panel:#17191f;--panel2:#1f222a;--line:#2c303a;
  --text:#f2f3f5;--muted:#9aa1ad;--yellow:#ffd23f;--green:#2ecc71;--red:#ff4d4d;
  --display:"Bungee",Impact,system-ui,sans-serif;
  --body:Figtree,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body)}
body{min-height:100vh;background:repeating-linear-gradient(45deg,#ffffff05 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,#00000040 0 2px,transparent 2px 6px),var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;margin:0;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;padding:10px 16px;background:#262a33;color:var(--text);border:1px solid #3a3f4b;box-shadow:0 3px 0 #000;transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #000}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
button.small{padding:6px 11px;font-size:13px;border-radius:8px}
/* botão principal: o semáforo da largada, apagado em volta e a luz verde acesa */
button.primary{background:radial-gradient(circle at 50% 40%,#5dff9e 0,#2ecc71 45%,#138a48 100%);color:#04210f;border:3px solid #111;font-family:var(--display);font-weight:400;letter-spacing:.03em;box-shadow:0 0 0 3px #2c303a,0 0 22px #2ecc7155,0 4px 0 #000;border-radius:999px;padding:12px 24px}
input,select{font:inherit;color:var(--text);background:#0b0c10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--yellow);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.hidden{display:none!important}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px;font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding:14px 16px 60px}
.chk{height:10px;background:repeating-conic-gradient(#f2f3f5 0 25%,#111 0 50%) 0 0/10px 10px}

/* cabeçalho */
.bar{position:sticky;top:0;z-index:20;background:#0d0e12ee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand h1{font-size:20px;white-space:nowrap}
.brand h1 span{color:var(--yellow)}
.tovila{flex:none;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px 6px 4px;border-radius:10px;white-space:nowrap}
.tovila:hover{color:var(--text)}
.roomtag{display:flex;align-items:center;gap:8px}
.roomtag .code{font:20px var(--display);letter-spacing:.1em;color:var(--yellow)}
.sm{display:none}
@media (max-width:640px){.lg{display:none}.sm{display:inline}.brand h1{font-size:16px}.inroom .brand h1{display:none}.roomtag .lbl{display:none}}

/* placa de box (entrada e sala de espera) */
.placa{position:relative;background:linear-gradient(180deg,#1b1d24,#121318);border:3px solid #2f333d;border-radius:12px;box-shadow:inset 0 0 0 2px #000,0 20px 40px #000a;overflow:hidden}
.placa .chk{border-bottom:2px solid #000}
.placa .in{padding:20px}
.placa h2,.placa h3{color:var(--yellow);text-shadow:0 2px 0 #000}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 140px)}
.hero h2{font-size:clamp(40px,6.5vw,76px);line-height:.95}
.hero h2 em{font-style:normal;color:var(--yellow)}
.hero p.lead{color:var(--muted);font-size:17px;max-width:470px;margin:14px 0 0}
.hero .art{margin-top:22px;max-width:520px}
.hero .art canvas{width:100%;height:auto;display:block;border-radius:12px;image-rendering:pixelated;box-shadow:0 20px 40px #000a}
.codein{text-transform:uppercase;letter-spacing:.3em;font:24px var(--display);text-align:center;color:var(--yellow)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:820px){.hero{grid-template-columns:1fr;min-height:0;padding-top:10px}}

.lobby{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.lobby h2{font-size:24px;margin-bottom:12px}
.pilot{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2);margin-bottom:8px;border-left:6px solid var(--c)}
.pilot .av{font-size:24px}
.pilot b{display:block;line-height:1.2}
.pilot small{color:var(--muted);font-size:12.5px}
.pilot .grow{flex:1;min-width:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
.dot.off{background:#555}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:38px;height:38px;border-radius:50%;padding:0;border:3px solid #111;box-shadow:0 2px 0 #000}
.colors button.on{outline:3px solid var(--yellow);outline-offset:2px}
.colors button.taken{opacity:.2}
/* garagem: cada carro com a ficha em fileiras de LED, como as luzes de troca de marcha do painel */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.car{display:grid;grid-template-columns:1fr;gap:4px;text-align:left;padding:10px;border-radius:10px;background:#101116;border:2px solid var(--line);box-shadow:none;font-weight:500}
.car canvas{width:100%;height:auto;image-rendering:pixelated;display:block}
.car b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--text);line-height:1.1}
.car p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.35;min-height:3.9em}
.car.on{border-color:var(--yellow);background:#1a1810}
.car.on b{color:var(--yellow)}
.spec{display:grid;grid-template-columns:5.6em 1fr;align-items:center;gap:2px 8px;font-size:12px;color:#c9ced6}
.leds{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.leds i{height:8px;border-radius:2px;background:#262a33;box-shadow:inset 0 -1px 0 #0006}
.leds i.g{background:#2ecc71;box-shadow:0 0 5px #2ecc7188}
.leds i.y{background:#ffd23f;box-shadow:0 0 5px #ffd23f88}
.leds i.r{background:#ff4d4d;box-shadow:0 0 5px #ff4d4d88}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{font-size:20px;padding:4px 8px;box-shadow:none}
.picker button.on{background:var(--yellow);border-color:var(--yellow)}
.picker button.taken{opacity:.25}
.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.tracks{grid-template-columns:1fr}}
.track{text-align:left;padding:8px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;gap:6px;box-shadow:none}
.track canvas{width:100%;aspect-ratio:1;border-radius:8px;display:block}
.track b{font-family:var(--display);font-weight:400;font-size:16px}
.track small{color:var(--muted);font-size:12px;line-height:1.3;font-weight:500}
.track.on{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow),0 0 18px #ffd23f44}
.seg{display:flex;background:#0b0c10;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;box-shadow:none;border:0;background:transparent;color:var(--muted);padding:9px 8px}
.seg button.on{background:var(--yellow);color:#1b1500}
.field{margin-top:14px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* corrida */
#race{position:fixed;inset:0;background:#000;z-index:30;touch-action:none;user-select:none;-webkit-user-select:none}
#screen{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;pointer-events:none;font-family:var(--display);color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.hud.tl{left:12px;top:10px}
.hud .pos{font-size:44px;line-height:1;color:var(--yellow)}
.hud .pos small{font-size:20px;color:#fff}
.hud .lap{font-size:18px}
.hud .time{font-size:16px;font-family:var(--body);font-weight:800}
.hud.tr{right:10px;top:10px;text-align:right}
#mini{width:120px;height:120px;background:#0008;border-radius:10px;border:2px solid #fff4}
.hud.br{right:12px;bottom:12px;font-size:22px}
.hud.bc{left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(40px,10vw,110px);white-space:nowrap}
.hud.msg{left:50%;top:20%;transform:translateX(-50%);font-size:clamp(20px,4.5vw,40px);white-space:nowrap;color:var(--yellow)}
.hud .board{font-family:var(--body);font-size:13px;font-weight:800;margin-top:6px;text-shadow:1px 1px 0 #000}
.hud .board div{display:flex;gap:6px;align-items:center}
.hud .board i{width:10px;height:10px;border-radius:2px;display:inline-block}
.topbtns{position:absolute;right:140px;top:10px;display:flex;gap:6px;z-index:3}
.topbtns button{padding:6px 10px;font-size:14px;background:#000a}
@media (max-width:640px){.topbtns{right:10px;top:110px}#mini{width:90px;height:90px}.hud .pos{font-size:34px}}
/* controles na tela (celular) */
.pad{position:absolute;bottom:14px;display:flex;gap:12px;z-index:3}
.pad.l{left:14px}.pad.r{right:14px}
.pad button{width:78px;height:78px;border-radius:50%;font-size:30px;background:#ffffff1f;border:2px solid #ffffff55;color:#fff;box-shadow:none;backdrop-filter:blur(3px)}
.pad button.on{background:#ffd23f99}
.pad button.gas{width:92px;height:92px;background:#2ecc7144}
.pad button.gas.on{background:#2ecc71cc}
.results{position:absolute;inset:0;display:grid;place-items:center;background:#000b;z-index:5;padding:16px}
.results .placa{width:min(560px,100%)}
.results table{width:100%;border-collapse:collapse;font-size:15px}
.results td{padding:7px 6px;border-bottom:1px solid var(--line)}
.results td:first-child{font-family:var(--display);color:var(--yellow);width:42px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#262a33;border:1px solid #3a3f4b;padding:10px 18px;border-radius:12px;font-weight:700;z-index:70;max-width:92vw;text-align:center;box-shadow:0 10px 30px #000a}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:88vh;overflow:auto}
.modal h2{font-size:24px;margin-bottom:8px;color:var(--yellow)}
.modal h3{font-size:16px;margin:14px 0 6px;color:var(--yellow)}
.modal ul{margin:0;padding-left:20px}
.modal li{margin:4px 0}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <a class="tovila" href="/" title="Voltar para a vila">← Vila</a>
    <div class="brand"><h1>🏁 Corrida da <span>Galera</span></h1></div>
    <div class="roomtag hidden" id="roomTag"><span class="lbl muted">Sala</span><span class="code" id="rCode"></span><button class="small" id="btnInvite" title="Copiar convite"><span class="lg">Convidar</span><span class="sm">🔗</span></button></div>
    <button class="ghost small" id="btnSound" title="Som">🔊</button>
    <button class="ghost small" id="btnRules" title="Como jogar"><span class="lg">Como jogar</span><span class="sm">❔</span></button>
  </div>
</header>

<div class="wrap">
  <section id="home" class="hidden">
    <div class="hero">
      <div>
        <h2>Kart na<br><em>Galera</em></h2>
        <p class="lead">Mônaco, Interlagos e Tóquio, com a câmera atrás do kart. Sem casca de banana: só pé no fundo. Os amigos correm junto como fantasmas, então ninguém bate em ninguém e a internet lenta não atrapalha.</p>
        <div class="art"><canvas id="heroArt" width="320" height="180"></canvas></div>
      </div>
      <div class="placa"><div class="chk"></div><div class="in">
        <h3 style="font-size:24px;margin-bottom:14px">Box da galera</h3>
        <label for="hName">Seu nome</label>
        <input id="hName" maxlength="8" placeholder="Ex.: Kizzy" autocomplete="off">
        <label for="hCode" style="margin-top:14px">Código da sala</label>
        <input id="hCode" class="codein" maxlength="5" placeholder="ABCDE" autocomplete="off">
        <div class="row" style="margin-top:14px"><button class="primary" id="btnJoin">Entrar</button><button class="ghost" id="btnWatch">Só assistir</button></div>
        <div class="or">ou</div>
        <button id="btnCreate" style="width:100%">Abrir sala nova</button>
        <div class="err" id="hErr"></div>
      </div></div>
    </div>
  </section>

  <section id="lobby" class="hidden">
    <div class="lobby">
      <div class="placa"><div class="chk"></div><div class="in">
        <h2>Pilotos</h2>
        <div id="pilots"></div>
        <div id="myPick" class="hidden" style="margin-top:16px">
          <label>Cor do kart</label><div class="colors" id="colorPick"></div>
          <label style="margin-top:14px">Seu carro</label><div class="cars" id="carPick"></div>
          <label style="margin-top:14px">Seu avatar</label><div class="picker" id="pawnPick"></div>
        </div>
      </div></div>
      <div class="placa"><div class="chk"></div><div class="in">
        <h2>Pista</h2>
        <div id="cfg"></div>
        <div id="startBox" style="margin-top:18px"></div>
      </div></div>
    </div>
  </section>
</div>

<section id="race" class="hidden">
  <canvas id="screen"></canvas>
  <div class="hud tl"><div class="pos" id="hPos"></div><div class="lap" id="hLap"></div><div class="time num" id="hTime"></div><div class="board" id="hBoard"></div></div>
  <div class="hud tr"><canvas id="mini" width="240" height="240"></canvas></div>
  <div class="hud br num" id="hSpeed"></div>
  <div class="hud bc" id="hBig"></div>
  <div class="hud msg" id="hMsg"></div>
  <div class="topbtns"><button id="bRespawn" title="Voltar para a pista">↺ Pista</button><button id="bExit" title="Sair da corrida">✕</button></div>
  <div class="pad l hidden" id="padL"><button data-k="left" aria-label="Esquerda">◀</button><button data-k="right" aria-label="Direita">▶</button></div>
  <div class="pad r hidden" id="padR"><button data-k="brake" aria-label="Frear">▼</button><button class="gas" data-k="gas" aria-label="Acelerar">▲</button></div>
  <div id="results" class="results hidden"></div>
</section>

<div class="modal hidden" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast hidden" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/corrida/pistas.js"></script>
<script>
const { PISTAS, CARROS, sample, SECTORS, WORLD } = window.Pistas;
const carOf = (p) => (p && CARROS[p.car]) || CARROS.equilibrado;
const COLORS = ["#e63946", "#1e88e5", "#43a047", "#fdd835", "#8e24aa", "#fb8c00", "#00acc1", "#f06292"];
const PAWNS = ["😎", "🤠", "👽", "🤖", "🐸", "🦊", "🐼", "🐯", "🦄", "🐙", "👻", "🤡", "🦁", "🐵", "🐧", "🏎️"];
const socket = io("/corrida");
const $ = (id) => document.getElementById(id);
const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let S = null, ME = null, offset = 0;
const sNow = () => Date.now() + offset;
const me = () => (S && ME && ME.id ? S.players.find((p) => p.id === ME.id) : null);
const P = (id) => S && S.players.find((p) => p.id === id);
function toast(msg, ms = 3200) { const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.add("hidden"), ms); }
function act(type, data = {}) { return new Promise((res) => socket.emit("act", { type, ...data }, (r) => { if (!r || !r.ok) toast(r ? r.error : "Sem conexão."); res(r && r.ok); })); }
const fmt = (s) => s == null ? "—" : `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const rng = (seed) => { let x = seed; return () => ((x = (x * 16807) % 2147483647) / 2147483647); };

// ---------- sons ----------
const Sound = (() => {
  let ac = null, on = store.get("corrida:sound") !== false, eng = null, skidG = null;
  function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }
  function tone(f, dur, { type = "square", vol = 0.12, at = 0 } = {}) {
    const c = ctx(); if (!c || !on) return; const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  // motor: dente de serra passando por um filtro, a nota sobe com a velocidade
  function engine(speed, racing) {
    const c = ctx(); if (!c) return;
    if (!eng) { const o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(); o.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; f.frequency.value = 700; g.gain.value = 0; o.connect(f); o2.connect(f); f.connect(g).connect(c.destination); o.start(); o2.start(); eng = { o, o2, g }; }
    const v = Math.abs(speed), t = c.currentTime;
    eng.o.frequency.setTargetAtTime(45 + v * 0.42, t, 0.05); eng.o2.frequency.setTargetAtTime(22 + v * 0.21, t, 0.05);
    eng.g.gain.setTargetAtTime(on && racing ? 0.035 + v * 0.00012 : 0, t, 0.08);
  }
  return {
    beep(hi) { tone(hi ? 880 : 440, hi ? 0.5 : 0.25, { vol: 0.15 }); },
    lap() { [660, 880].forEach((f, i) => tone(f, 0.15, { at: i * 0.12 })); },
    finish() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.18, { at: i * 0.13, type: "triangle", vol: 0.16 })); },
    bump() { tone(90, 0.12, { type: "sawtooth", vol: 0.12 }); },
    skid(lvl) { const c = ctx(); if (!c) return; if (!skidG) { const len = c.sampleRate, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = b; src.loop = true; f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 6; g.gain.value = 0; src.connect(f).connect(g).connect(c.destination); src.start(); skidG = g; } skidG.gain.setTargetAtTime(on && lvl ? Math.min(0.06, lvl / 4000) : 0, c.currentTime, 0.05); },
    pop() { tone(700, 0.05, { vol: 0.06 }); },
    engine, toggle() { on = !on; store.set("corrida:sound", on); if (!on) engine(0, false); }, get on() { return on; }, unlock() { ctx(); },
  };
})();
function renderSoundBtn() { $("btnSound").textContent = Sound.on ? "🔊" : "🔇"; }
$("btnSound").onclick = () => { Sound.toggle(); renderSoundBtn(); };
renderSoundBtn();
document.addEventListener("pointerdown", () => Sound.unlock(), { once: true });

// ---------- entrar / criar ----------
const urlCode = new URLSearchParams(location.search).get("sala");
$("hName").value = store.get("galera:name") || "";
if (urlCode) $("hCode").value = urlCode.toUpperCase();
function enter(r) {
  if (!r.ok) { $("hErr").textContent = r.error; return; }
  ME = { code: r.code, id: r.id, token: r.token };
  if (r.id) store.set("corrida:" + r.code, ME);
  history.replaceState(null, "", "/corrida/?sala=" + r.code);
  $("roomTag").classList.remove("hidden"); $("rCode").textContent = r.code; document.body.classList.add("inroom");
}
$("btnCreate").onclick = () => { const name = $("hName").value.trim(); store.set("galera:name", name); socket.emit("create", { name }, enter); };
$("btnJoin").onclick = () => {
  const name = $("hName").value.trim(), code = $("hCode").value.trim().toUpperCase(); store.set("galera:name", name);
  if (code.length !== 5) return ($("hErr").textContent = "O código tem 5 letras.");
  const saved = store.get("corrida:" + code) || {};
  socket.emit("join", { code, name, id: saved.id, token: saved.token }, enter);
};
$("btnWatch").onclick = () => { const code = $("hCode").value.trim().toUpperCase(); if (code.length !== 5) return ($("hErr").textContent = "Coloque o código da sala."); socket.emit("join", { code, watch: true }, enter); };
$("hCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnJoin").click(); });
$("btnInvite").onclick = async () => { const link = location.origin + "/corrida/?sala=" + ME.code; try { await navigator.clipboard.writeText(link); toast("Convite copiado! Manda no grupo."); } catch { prompt("Copie o convite:", link); } };
function autoJoin() {
  const code = urlCode ? urlCode.toUpperCase() : null, saved = code && store.get("corrida:" + code);
  if (saved && saved.id) socket.emit("join", { code, id: saved.id, token: saved.token }, (r) => { if (r.ok) enter(r); else { show("home"); $("hErr").textContent = r.error; } });
  else if (ME) socket.emit("join", { code: ME.code, watch: !ME.id, id: ME.id, token: ME.token }, () => {});
  else show("home");
}
socket.on("connect", autoJoin);
socket.on("kicked", () => { toast("O organizador tirou você da sala."); ME = null; S = null; history.replaceState(null, "", "/corrida/"); document.body.classList.remove("inroom"); $("roomTag").classList.add("hidden"); show("home"); });
function show(id) {
  for (const s of ["home", "lobby"]) $(s).classList.toggle("hidden", s !== id);
  $("race").classList.toggle("hidden", id !== "race");
  $("bar").classList.toggle("hidden", id === "race");
}

// ---------- estado vindo do servidor ----------
socket.on("state", (st) => {
  offset = st.now - Date.now();
  const old = S; S = st;
  if (st.phase === "lobby") { show("lobby"); renderLobby(); stopRace(); return; }
  show("race");
  if (!race || race.startAt !== st.startAt) startRace(st);
  if (old && old.phase === "race" && st.phase === "results") Sound.finish();
  checkMyLap(old);
  renderResults();
});

// ---------- sala de espera ----------

    <div class="field"><label>Voltas</label><div class="seg">${[1, 2, 3, 5].map((v) => `<button data-v="${v}" class="${c.voltas === v ? "on" : ""}" ${dis}>${v}</button>`).join("")}</div></div>`;

  $("cfg").querySelectorAll("[data-pista]").forEach((b) => (b.onclick = () => act("config", { config: { ...S.config, pista: b.dataset.pista } })));
  $("cfg").querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => act("config", { config: { ...S.config, voltas: +b.dataset.v } })));

// ----- pintura do chão (visto de cima) e do mapa de superfície (0 terra/grama/calçada, 1 pista, 3 muro) -----

const surfAt = (tr, x, y) => (x < 0 || y < 0 || x >= WORLD || y >= WORLD ? 3 : tr.surf[(y | 0) * WORLD + (x | 0)]);

function respawn() {

// Física do kart (arcade com aderência): o carro tem inércia e os pneus só seguram uma certa força de lado.

// limite de aderência (grip). Entrou rápido demais, o que sobra vira escorregão para fora da curva, que come

  const items = [];
  const proj = (x, y) => { const dx = x - cam.x, dy = y - cam.y, z = dx * cam.fx + dy * cam.fy; if (z < 12 || z > ZMAX) return null; const s = F / z; return { sx: IW / 2 + (dx * rx + dy * ry) * s, sy: hz + CAM_H * s, s, z }; };
  for (const sp of tr.spr) { const p = proj(sp.x, sp.y); if (!p) continue; const w = sp.w * p.s; if (p.sx + w < 0 || p.sx - w > IW) continue; items.push({ z: p.z, fn: () => g2.drawImage(sp.img, p.sx - w / 2, p.sy - sp.h * p.s, w, sp.h * p.s) }); }
  for (const [id, gh] of race.ghosts) {
    if (!me() && cam.src === gh) continue;
    const pl = P(id); if (!pl) continue;
    const p = proj(gh.x, gh.y); if (!p) continue;
    let rel = gh.a - cam.a; while (rel > Math.PI) rel -= 2 * Math.PI; while (rel < -Math.PI) rel += 2 * Math.PI;
    const view = Math.abs(rel) < 0.8 ? "back" : Math.abs(rel) > 2.3 ? "front" : "side", flip = view === "side" && rel < 0;
    items.push({ z: p.z, fn: () => drawKart(pl.color, view, flip, p.sx, p.sy, KART_W * p.s, 0.55, pl, 0, pl.car) });
  }
  items.sort((a, b) => b.z - a.z).forEach((it) => it.fn());
  // o meu kart (ou o do líder, para quem assiste)
  const s = F / CAM_D, src = cam.src;
  const pl = me() || (standings()[0] && P(standings()[0].id));
  if (pl) {
    const slide = me() ? Math.max(-1, Math.min(1, (race.car.slip || 0) / 160)) * Math.sign(race.car.steer || 1) : 0;
    const lean = me() ? race.car.steer + slide * 0.8 : 0, kx = IW / 2 + lean * 3, ky = hz + CAM_H * s + (race.offroad ? (Math.random() - 0.5) * 2 : 0);
    // escorregando: fumaça dos pneus
    if (me() && race.car.slip > 45) { g2.fillStyle = `rgba(230,230,230,${Math.min(0.6, race.car.slip / 300)})`; for (let k = 0; k < 4; k++) { const px = kx + (k % 2 ? 1 : -1) * KART_W * s * 0.42 + (Math.random() - 0.5) * 6, py = ky - 2 + Math.random() * 3; g2.beginPath(); g2.arc(px, py, 2 + Math.random() * 3, 0, 7); g2.fill(); } }
    drawKart(pl.color, "back", false, kx, ky, KART_W * s, 1, null, lean, pl.car);
  }
}
function horizon(IW, IH) { const F = IW * 0.62; return Math.round(Math.max(IH * 0.36, IH * 0.86 - (CAM_H * F) / CAM_D)); }
function drawKart(color, view, flip, x, y, w, alpha, tag, lean = 0, model) {
  const im = kartImg(color, view, model), hh = w * 0.75;
  g2.save(); g2.globalAlpha = alpha; g2.translate(x, y); if (lean) g2.rotate(lean * 0.06); if (flip) g2.scale(-1, 1);
  g2.drawImage(im, -w / 2, -hh, w, hh);
  g2.restore();
  if (tag && w > 10) { g2.font = `bold ${Math.max(7, Math.min(11, w * 0.35))}px Figtree, sans-serif`; g2.textAlign = "center"; g2.fillStyle = "#000a"; g2.fillText(tag.name, x + 1, y - hh - 2); g2.fillStyle = "#fff"; g2.fillText(tag.name, x, y - hh - 3); }
}

// ---------- placar da corrida ----------
function standings() {
  if (!S || !race) return [];
  const rows = S.players.map((p) => {
    const gh = race.ghosts.get(p.id), prog = ME && p.id === ME.id ? myProg() : gh ? gh.prog : -1e9;
    return { id: p.id, p, prog, done: p.finish };
  });
  return rows.sort((a, b) => (a.done != null || b.done != null ? (a.done ?? 1e9) - (b.done ?? 1e9) : b.prog - a.prog));
}
function hud() {
  if (!S) return;
  const m = me(), st = standings(), now = sNow(), cfg = S.config, tr = race.tr;
  const left = (race.startAt - now) / 1000;
  // contagem 3, 2, 1, VAI!
  let big = "";
  if (left > 0) { const n = Math.ceil(left); big = n <= 3 ? String(n) : ""; if (n <= 3 && race.beeped !== n) { race.beeped = n; Sound.beep(false); } }
  else if (left > -1) { big = "VAI!"; if (race.beeped !== 0) { race.beeped = 0; Sound.beep(true); } }
  if (m && m.finish != null && S.phase === "race") big = "";
  $("hBig").textContent = big;
  $("hBig").style.color = left > 0 ? "#ff4d4d" : "#2ecc71";
  if (m) {
    const pos = st.findIndex((r) => r.id === m.id) + 1;
    $("hPos").innerHTML = `${pos}º<small>/${st.length}</small>`;
    const lap = Math.min(cfg.voltas, (m.started ? m.laps : 0) + 1);
    $("hLap").textContent = m.finish != null ? "CHEGADA!" : `VOLTA ${lap}/${cfg.voltas}`;
    const t = m.finish != null ? m.finish : Math.max(0, (now - race.startAt) / 1000);
    $("hTime").textContent = `${fmt(t)}${m.best != null ? ` · melhor ${fmt(m.best)}` : ""}`;
    $("hSpeed").textContent = `${Math.round(Math.abs(race.car.v) * 0.75)} km/h`;
  } else { $("hPos").innerHTML = "👀"; $("hLap").textContent = "ASSISTINDO"; $("hTime").textContent = fmt(Math.max(0, (now - race.startAt) / 1000)); $("hSpeed").textContent = ""; }
  $("hBoard").innerHTML = st.slice(0, 8).map((r, i) => `<div><span>${i + 1}.</span><i style="background:${r.p.color}"></i>${h(r.p.name)}${r.done != null ? " 🏁" : ""}</div>`).join("");
  // avisos
  let msg = "";
  if (race.wrong > 1) msg = "⚠️ CONTRAMÃO! (aperte ↺)";
  else if (m && m.finish == null && m.started && m.laps === cfg.voltas - 1 && cfg.voltas > 1 && race.lastLapMsg > now - 2500) msg = "ÚLTIMA VOLTA!";
  else if (S.endAt && m && m.finish == null) msg = `⏱️ ${Math.max(0, Math.ceil((S.endAt - now) / 1000))} s para cruzar`;
  $("hMsg").textContent = msg;
  // minimapa
  const mc = $("mini").getContext("2d"), k = 240 / WORLD;
  mc.drawImage(tr.mini, 0, 0);
  for (const r of st) {
    const gh = ME && r.id === ME.id ? race.car : race.ghosts.get(r.id); if (!gh) continue;
    mc.fillStyle = r.p.color; mc.strokeStyle = "#000"; mc.lineWidth = 2; mc.beginPath(); mc.arc(gh.x * k, gh.y * k, ME && r.id === ME.id ? 7 : 5, 0, 7); mc.fill(); mc.stroke();
  }
}
// volta nova: bipe e "última volta"
function checkMyLap(old) {
  const m = me(), o = old && ME && old.players.find((p) => p.id === ME.id);
  if (!m || !o || !race) return;
  if (m.laps > o.laps) { if (m.finish != null) Sound.finish(); else { Sound.lap(); race.lastLapMsg = sNow(); } }
}
function renderResults() {
  const el = $("results");
  if (!S || S.phase !== "results") { el.classList.add("hidden"); return; }
  const m = me(), isHost = m && S.host === m.id, rows = standings();
  el.classList.remove("hidden");
  el.innerHTML = `<div class="placa"><div class="chk"></div><div class="in"><h2 style="font-size:28px;margin-bottom:10px">🏆 Resultado · ${h(PISTAS[S.config.pista].name)}</h2>
    <table>${rows.map((r, i) => `<tr><td>${r.done != null ? i + 1 + "º" : "—"}</td><td>${r.p.pawn} <b style="color:${r.p.color}">${h(r.p.name)}</b></td><td class="num">${r.done != null ? fmt(r.done) : "não terminou"}</td><td class="num muted">${r.p.best != null ? "melhor " + fmt(r.p.best) : ""}</td></tr>`).join("")}</table>
    <div class="row" style="margin-top:14px;justify-content:center">${isHost ? `<button class="primary" id="rAgain">🏁 Correr de novo</button><button id="rLobby">Trocar pista</button>` : `<span class="muted">Esperando o organizador…</span>`}<button class="ghost" onclick="location.href='/'">🏠 Vila</button></div></div></div>`;
  if ($("rAgain")) $("rAgain").onclick = () => act("start");
  if ($("rLobby")) $("rLobby").onclick = () => act("lobby");
}

// ---------- como jogar ----------
$("btnRules").onclick = () => {
  $("modalBox").innerHTML = `<h2>Como jogar</h2>
  <h3>Controles</h3><ul>
  <li><b>Teclado:</b> ↑ ou W acelera, ↓ ou S freia (e dá ré), ← → ou A D viram. R volta para a pista.</li>
  <li><b>Celular:</b> ◀ ▶ à esquerda viram; ▲ acelera e ▼ freia à direita.</li>
  <li><b>↺ Pista:</b> se rodar, ficar preso ou entrar na contramão, volta para o meio da pista.</li></ul>
  <h3>A corrida</h3><ul>
  <li>Largada igual para todo mundo: 3, 2, 1… vai! Ganha quem completar as voltas primeiro.</li>
  <li>Os outros karts são <b>fantasmas</b>: dá para passar por dentro deles. Ninguém bate em ninguém, e internet lenta não atrapalha a sua corrida.</li>
  <li><b>Freie antes da curva.</b> O pneu só segura até certo ponto: entrou rápido demais, o kart escorrega para fora (sai fumaça e o pneu canta) e perde velocidade. Fora do asfalto ele fica lento; em Mônaco e em Tóquio tem muro.</li>
  <li>A volta só conta passando pela pista inteira, na ordem. Atalho e contramão não valem.</li>
  <li>Quando o primeiro cruza a chegada, os outros têm 45 segundos para terminar.</li></ul>
  <h3>Carros</h3><ul>${Object.values(CARROS).map((k) => `<li><b>${h(k.name)}:</b> ${h(k.desc)}</li>`).join("")}</ul>
  <h3>Pistas</h3><ul>
  <li><b>Mônaco:</b> estreita, com guard-rail colado, subida do Cassino, o grampo e o porto cheio de iates.</li>
  <li><b>Interlagos:</b> larga e rápida: S do Senna, Reta Oposta, Bico de Pato e a subida dos boxes.</li>
  <li><b>Tóquio:</b> de noite, entre os prédios de neon, com a Tokyo Tower e o Fuji no horizonte.</li></ul>
  <div class="row" style="margin-top:16px"><button class="primary" id="rulesOk">Bora!</button></div>`;
  $("modal").classList.remove("hidden");
  $("rulesOk").onclick = () => $("modal").classList.add("hidden");
};
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.add("hidden"); });

// ---------- capa: a largada de Interlagos vista da câmera (o mesmo desenho da corrida) ----------
(function heroArt() {
  const paint = () => {
    const tr = buildTrack("interlagos"), at = (g) => gridSpot(tr.pts, g, tr.t.width);
    const mine = at(4), a = at(0), b = at(1);
    const keep = { race, S, ME, img, buf, w: cv.width, h: cv.height };
    race = { startAt: Infinity, tr, car: { x: mine.x, y: mine.y, a: mine.a, v: 0, steer: 0.5 }, ghosts: new Map([["a", { x: a.x, y: a.y, a: a.a }], ["b", { x: b.x, y: b.y, a: b.a }]]), shake: 0, idx: mine.idx };
    S = { phase: "lobby", players: [{ id: "eu", name: "", color: COLORS[0], laps: 0 }, { id: "a", name: "Bia", color: COLORS[1] }, { id: "b", name: "Caio", color: COLORS[2] }] };
    ME = { id: "eu" };
    cv.width = 320; cv.height = 180; img = g2.createImageData(320, 180); buf = new Uint32Array(img.data.buffer);
    try { draw(); $("heroArt").getContext("2d").drawImage(cv, 0, 0); }
    finally { ({ race, S, ME, img, buf } = keep); cv.width = keep.w; cv.height = keep.h; }
  };
  setTimeout(() => (document.fonts && document.fonts.ready ? document.fonts.ready.then(paint) : paint()), 50);
})();
</script>
