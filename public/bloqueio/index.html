<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<script src="/semzoom.js"></script>
<title>Bloqueio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23c9a36b'/><rect x='18' y='44' width='64' height='12' rx='4' fill='%232a1d0e'/><circle cx='30' cy='76' r='9' fill='%23ff8a3d'/><circle cx='70' cy='24' r='9' fill='%234fb0ff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* mesa de madeira à noite: tampo escuro, tabuleiro de nogueira, paredes de mogno */
  --bg:#12100d;--panel:#1d1914;--panel2:#26201a;--line:#3a3128;--text:#f4efe6;--muted:#aa9f8e;--gold:#f5b93c;--gold2:#b78113;--bad:#ff6b6b;--good:#6ee7a0;
  --p0:#ff8a3d;--p1:#4fb0ff;--p2:#6ee7a0;--p3:#c58bff;--display:"Chango",Georgia,serif;--body:Figtree,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body);overflow-x:hidden}
body{min-height:100vh;background:radial-gradient(900px 500px at 50% -120px,#4a3820 0%,transparent 70%),radial-gradient(600px 400px at 100% 100%,#2a1d12 0%,transparent 70%),var(--bg)}
.hidden{display:none!important}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 16px;background:linear-gradient(#3a3025,#2a2219);color:var(--text);border:1px solid #54463a;box-shadow:0 3px 0 #070504;transition:transform .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.18)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #070504}
button.primary{background:linear-gradient(#ffcf63,#e29a14);color:#2a1a00;border-color:#b78113}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;background:#0e0c09;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.topo{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#14110d99}
.topo a{color:var(--muted);text-decoration:none;font-weight:700}
.topo h1{margin:0;font:400 20px var(--display);color:var(--gold);letter-spacing:.5px}
#roomTag{color:var(--muted)}
#roomTag b{color:var(--gold);letter-spacing:3px}
#btnSom{padding:6px 10px;font-size:16px;margin-left:auto}
#roomTag:not(.hidden){margin-left:auto}
#roomTag:not(.hidden)+#btnSom{margin-left:0}
main{max-width:1020px;margin:0 auto;padding:16px}
.card{background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px #0008}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.err{color:var(--bad);min-height:1.4em;margin-top:8px}
h2{font:400 22px var(--display);margin:0 0 10px}
/* entrada */
.home{max-width:460px;margin:24px auto;display:grid;gap:12px}
.home .logo{display:flex;justify-content:center}
.home .logo svg{width:150px;height:150px;filter:drop-shadow(0 10px 14px #000a)}
.home label{font-weight:700;font-size:13px;color:var(--muted)}
.home h2{text-align:center;font-size:30px;color:var(--gold);margin:0}
/* sala */
.jog{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#0003;margin-bottom:6px;animation:entra .35s both}
.jog .av{font-size:24px;width:34px;text-align:center}
.jog .nm{flex:1;font-weight:700}
.jog .cor{width:12px;height:12px;border-radius:50%}
.avs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.avs button{padding:4px 8px;font-size:20px}
.avs button.on{border-color:var(--gold);background:#3a3320}
/* jogo */
.jogo{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media(max-width:780px){.jogo{grid-template-columns:1fr}}
.mesa{padding:12px;background:radial-gradient(circle at 50% 30%,#3a2c1c,#1c150e)}
#tab{width:100%;max-width:640px;aspect-ratio:1;display:block;margin:0 auto;touch-action:manipulation;filter:drop-shadow(0 14px 18px #000a)}
.cards{display:grid;gap:8px}
.pc{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:linear-gradient(var(--panel2),var(--panel));transition:border-color .25s,transform .25s,box-shadow .25s}
.pc.vez{border-color:var(--cor);box-shadow:0 0 0 3px color-mix(in srgb,var(--cor) 30%,transparent),0 6px 18px #0008;transform:translateX(-4px)}
.pc .cor{width:14px;height:14px;border-radius:50%;background:var(--cor);box-shadow:0 0 10px var(--cor)}
.pc .nm{flex:1;font-weight:800}
.pc.off .nm{opacity:.45}
.pc .paredes{display:flex;gap:2px;align-items:center}
.pc .paredes i{width:5px;height:16px;border-radius:2px;background:linear-gradient(#a0623a,#5e3418);box-shadow:0 1px 0 #000a}
.pc .paredes i.gasta{opacity:.18}
.barra{height:8px;background:#0b0907;border-radius:8px;overflow:hidden;margin:10px 0;border:1px solid var(--line)}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5b93c,#ff8a3d);border-radius:8px}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.modo button.on{background:linear-gradient(#ffcf63,#e29a14);color:#2a1a00;border-color:#b78113}
.dica{font-size:13px;color:var(--muted);min-height:2.6em}
#log{font-size:13px;color:var(--muted);max-height:150px;overflow:auto;margin-top:10px}
#log div{padding:2px 0;animation:entra .3s both}
.fim{text-align:center;padding:14px;margin-bottom:10px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.fim h2{color:var(--gold);font-size:24px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 18px;border-radius:14px;z-index:70;font-weight:700}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:65;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes entra{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
/* tabuleiro */
#tab .peao{transition:transform .38s cubic-bezier(.3,1.35,.5,1)}
#tab .peao .corpo{transform-box:fill-box;transform-origin:50% 100%}
#tab .peao.vez .corpo{animation:salta 1.1s ease-in-out infinite}
#tab .parede.nova{animation:cai .45s cubic-bezier(.3,1.5,.5,1) both}
#tab .dica-casa{animation:pulsa 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#tab .rastro{animation:some 1.6s ease-out both}
#tab .slot{transition:fill .12s,opacity .12s}
@keyframes salta{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes cai{from{opacity:0;transform:translateY(-6px) scale(1.15)}}
@keyframes pulsa{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.15);opacity:.95}}
@keyframes some{from{opacity:.8}to{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topo"><a href="/">← Vila</a><h1>Bloqueio</h1><span id="roomTag" class="hidden">Mesa <b id="rCode"></b></span><button id="btnSom" title="Som">🔊</button></div>
<main>
  <section id="home" class="home card hidden">
    <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b47a"/><stop offset="1" stop-color="#9c7640"/></linearGradient><radialGradient id="lo" cx=".35" cy=".3"><stop offset="0" stop-color="#ffb784"/><stop offset="1" stop-color="#d35f10"/></radialGradient><radialGradient id="la" cx=".35" cy=".3"><stop offset="0" stop-color="#a6d6ff"/><stop offset="1" stop-color="#1e78c8"/></radialGradient></defs><rect x="4" y="4" width="92" height="92" rx="14" fill="url(#lg)"/><g fill="#ecd3a3"><rect x="12" y="12" width="24" height="24" rx="4"/><rect x="40" y="12" width="24" height="24" rx="4"/><rect x="68" y="12" width="20" height="24" rx="4"/><rect x="12" y="64" width="24" height="24" rx="4"/><rect x="40" y="64" width="24" height="24" rx="4"/><rect x="68" y="64" width="20" height="24" rx="4"/></g><rect x="10" y="44" width="56" height="11" rx="4" fill="#4a2a12"/><circle cx="24" cy="76" r="11" fill="url(#lo)"/><circle cx="76" cy="24" r="11" fill="url(#la)"/></svg></div>
    <h2>Bloqueio</h2>
    <p class="muted" style="margin:0">Cruze o tabuleiro primeiro. Na sua vez, ande uma casa (pode pular o peão que está na frente) ou ponha uma parede para atrapalhar — mas nunca feche todo o caminho de alguém. 2 ou 4 jogadores, com robôs para completar.</p>
    <div><label for="hName">Seu nome</label><input id="hName" maxlength="8" placeholder="Ex.: Kizzy" autocomplete="off"></div>
    <div><label for="hCode">Código da mesa</label><input id="hCode" maxlength="5" placeholder="ABCDE" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;text-align:center"></div>
    <div class="row"><button class="primary" id="btnJoin">Entrar</button><button id="btnWatch">Só assistir</button></div>
    <button id="btnCreate">Criar mesa nova</button>
    <div class="err" id="hErr"></div>
  </section>

  <section id="lobby" class="card hidden">
    <h2 style="margin:0 0 8px">Sala de espera</h2>
    <div id="lobbyJog"></div>
    <div class="avs" id="avs"></div>
    <div class="row" id="lobbyHost">
      <label class="muted">Tempo por jogada <select id="cfgTimer" style="width:auto"><option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option></select></label>
      <button id="btnBot">+ Robô</button>
    </div>
    <div class="row" style="margin-top:12px"><button class="primary" id="btnStart">Começar</button><button id="btnInvite">Copiar convite</button></div>
    <p class="muted" id="lobbyMsg"></p>
  </section>

  <section id="jogo" class="hidden">
    <div class="jogo">
      <div class="card mesa"><svg id="tab" viewBox="0 0 100 100" role="img" aria-label="Tabuleiro do Bloqueio"></svg></div>
      <div>
        <div class="cards" id="cards"></div>
        <div class="barra"><i id="tempo"></i></div>
        <div class="dica" id="dica"></div>
        <div class="modo" id="modo"><button data-m="mover" class="on">Andar</button><button data-m="parede">Pôr parede</button></div>
        <div id="fim" class="card fim hidden"></div>
        <div id="log"></div>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="hidden"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/noite.js"></script>
<script src="/comum.js"></script>
<script src="/bloqueio/regras.js"></script>
<script>
const B = window.Bloqueio, socket = io("/bloqueio"), { $, h, store } = Comum;
const relogio = Comum.relogio(), toast = Comum.criarToast(3000), act = Comum.criarAct(socket, toast);
const CORES = ["#ff8a3d", "#4fb0ff", "#6ee7a0", "#c58bff"]; // por lugar: embaixo, esquerda, em cima, direita
const CLARAS = ["#ffc9a0", "#b5e0ff", "#c4f7d8", "#e6cdff"];
let S = null, ME = null, modo = "mover";
const eu = () => (S && ME && ME.id ? S.players.findIndex((p) => p.id === ME.id) : -1);
const minhaVez = () => S && S.phase === "playing" && eu() >= 0 && S.game.vez === eu();
const mostrar = (id) => ["home", "lobby", "jogo"].forEach((x) => $(x).classList.toggle("hidden", x !== id));

// ---------- som (WebAudio, sem arquivos) ----------
const Som = (() => {
  let ac = null, on = store.get("bloqueio:som") !== false;
  const nota = (f, t0, dur, tipo = "sine", vol = 0.12) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, ac.currentTime + t0); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
    o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + 0.02);
  };
  const sons = { passo: () => nota(520, 0, 0.09, "triangle"), parede: () => { nota(120, 0, 0.18, "square", 0.1); nota(90, 0.03, 0.2, "sawtooth", 0.06); }, vez: () => { nota(660, 0, 0.1); nota(880, 0.09, 0.14); }, vitoria: () => [523, 659, 784, 1046].forEach((f, i) => nota(f, i * 0.12, 0.25, "triangle")), erro: () => nota(180, 0, 0.15, "square", 0.07) };
  return { tocar(k) { if (!on) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); sons[k](); } catch {} }, alternar() { on = !on; store.set("bloqueio:som", on); $("btnSom").textContent = on ? "🔊" : "🔇"; }, get on() { return on; } };
})();
$("btnSom").textContent = Som.on ? "🔊" : "🔇";
$("btnSom").onclick = Som.alternar;

// ---------- entrar ----------
const urlCode = new URLSearchParams(location.search).get("mesa");
$("hName").value = store.get("galera:name") || "";
if (urlCode) $("hCode").value = urlCode.toUpperCase();
function entrou(r) {
  if (!r.ok) { $("hErr").textContent = r.error; return; }
  ME = { code: r.code, id: r.id, token: r.token };
  if (r.id) store.set("bloqueio:" + r.code, ME);
  history.replaceState(null, "", "/bloqueio/?mesa=" + r.code);
  $("roomTag").classList.remove("hidden"); $("rCode").textContent = r.code;
}
$("btnCreate").onclick = () => { const name = $("hName").value.trim(); store.set("galera:name", name); socket.emit("create", { name }, entrou); };
$("btnJoin").onclick = () => {
  const name = $("hName").value.trim(), code = $("hCode").value.trim().toUpperCase(); store.set("galera:name", name);
  if (code.length !== 5) return ($("hErr").textContent = "O código tem 5 letras.");
  const saved = store.get("bloqueio:" + code) || {};
  socket.emit("join", { code, name, id: saved.id, token: saved.token }, entrou);
};
$("btnWatch").onclick = () => { const code = $("hCode").value.trim().toUpperCase(); if (code.length !== 5) return ($("hErr").textContent = "Coloque o código da mesa."); socket.emit("join", { code, watch: true }, entrou); };
$("hCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnJoin").click(); });
$("btnInvite").onclick = async () => { const link = location.origin + "/bloqueio/?mesa=" + ME.code; try { await navigator.clipboard.writeText(link); toast("Convite copiado! Manda no grupo."); } catch { prompt("Copie o convite:", link); } };
socket.on("connect", () => {
  const code = urlCode ? urlCode.toUpperCase() : ME && ME.code, saved = code && store.get("bloqueio:" + code);
  if (saved && saved.id) socket.emit("join", { code, id: saved.id, token: saved.token }, (r) => { if (r.ok) entrou(r); else { mostrar("home"); $("hErr").textContent = r.error; } });
  else if (ME) socket.emit("join", { code: ME.code, watch: !ME.id, id: ME.id, token: ME.token }, () => {});
  else mostrar("home");
});
socket.on("kicked", () => { toast("O organizador tirou você da mesa."); ME = null; S = null; history.replaceState(null, "", "/bloqueio/"); $("roomTag").classList.add("hidden"); mostrar("home"); });

// ---------- sala de espera ----------
$("btnBot").onclick = () => act("addBot");
$("btnStart").onclick = () => act("start");
$("cfgTimer").onchange = () => act("config", { config: { timer: +$("cfgTimer").value } });
function desenharLobby() {
  const host = ME && S.host === ME.id;
  $("lobbyJog").innerHTML = S.players.map((p) => `<div class="jog"><span class="cor" style="background:${CORES[B.lugaresDe(S.players.length)[S.players.indexOf(p)]]}"></span><span class="av">${p.pawn}</span><span class="nm">${h(p.name)}${p.id === S.host ? " 👑" : ""}${p.bot ? " (robô)" : ""}</span>${host && p.id !== ME.id ? `<button data-kick="${p.id}">Tirar</button>` : ""}</div>`).join("");
  $("lobbyJog").querySelectorAll("[data-kick]").forEach((b) => (b.onclick = () => act("kick", { id: b.dataset.kick })));
  const meu = S.players.find((p) => ME && p.id === ME.id), usados = new Set(S.players.map((p) => p.pawn));
  $("avs").innerHTML = meu ? B.AVATARES.map((a) => `<button class="${a === meu.pawn ? "on" : ""}" ${usados.has(a) && a !== meu.pawn ? "disabled" : ""} data-a="${a}">${a}</button>`).join("") : "";
  $("avs").querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => act("pawn", { pawn: b.dataset.a })));
  $("lobbyHost").classList.toggle("hidden", !host);
  $("btnStart").classList.toggle("hidden", !host);
  $("cfgTimer").value = S.config.timer;
  const n = S.players.length;
  $("lobbyMsg").textContent = n === 2 || n === 4 ? (host ? "Tudo pronto: pode começar." : "Esperando o organizador começar.") : "O jogo é de 2 ou 4 jogadores: chame mais gente ou ponha robôs.";
}

// ---------- tabuleiro ----------
const SZ = 100 / 9, NS = "http://www.w3.org/2000/svg";
const jogoAtual = () => ({ ...S.game, metas: B.lugaresDe(S.game.n).map((l) => B.LUGARES[l].meta) });
const centro = (r, c) => [c * SZ + SZ / 2, r * SZ + SZ / 2];
let camadas = null, paredesVistas = 0, rodadaVista = null;
function montarTabuleiro() {
  const svg = $("tab");
  let cel = "";
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) cel += `<rect x="${c * SZ + 0.9}" y="${r * SZ + 0.9}" width="${SZ - 1.8}" height="${SZ - 1.8}" rx="1.4" fill="url(#cel)"/>`;
  svg.innerHTML = `<defs>
    <linearGradient id="mad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b98a52"/><stop offset=".5" stop-color="#9c6f3c"/><stop offset="1" stop-color="#7d5629"/></linearGradient>
    <pattern id="veio" width="100" height="6" patternUnits="userSpaceOnUse"><path d="M0 1.5 Q25 .2 50 1.5 T100 1.5 M0 4.5 Q30 3 60 4.5 T100 4.4" stroke="#00000018" stroke-width=".35" fill="none"/></pattern>
    <linearGradient id="cel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efd7a6"/><stop offset="1" stop-color="#d9b97c"/></linearGradient>
    <linearGradient id="par" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3f1e"/><stop offset=".5" stop-color="#5e2610"/><stop offset="1" stop-color="#3b1708"/></linearGradient>
    <radialGradient id="brilho" cx=".35" cy=".28" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  </defs>
  <rect width="100" height="100" rx="3" fill="url(#mad)"/><rect width="100" height="100" rx="3" fill="url(#veio)"/>
  <rect x=".6" y=".6" width="98.8" height="98.8" rx="2.6" fill="none" stroke="#00000055" stroke-width="1.2"/>
  <g id="gCel">${cel}</g><g id="gMeta"></g><g id="gUlt"></g><g id="gPar"></g><g id="gDica"></g><g id="gPeao"></g><g id="gSlot"></g>`;
  camadas = { meta: svg.querySelector("#gMeta"), ult: svg.querySelector("#gUlt"), par: svg.querySelector("#gPar"), dica: svg.querySelector("#gDica"), peao: svg.querySelector("#gPeao"), slot: svg.querySelector("#gSlot") };
  paredesVistas = 0;
}
function paredeSVG(w, fill, attrs = "", esp = 1.9) {
  const x = w.o === "h" ? w.c * SZ + 1 : (w.c + 1) * SZ - esp / 2, y = w.o === "h" ? (w.r + 1) * SZ - esp / 2 : w.r * SZ + 1;
  const ww = w.o === "h" ? 2 * SZ - 2 : esp, hh = w.o === "h" ? esp : 2 * SZ - 2;
  return `<rect ${attrs} x="${x}" y="${y}" width="${ww}" height="${hh}" rx=".9" fill="${fill}"/>`;
}
function peaoSVG(i, jog, lug) {
  const cor = CORES[lug];
  return `<g class="corpo"><ellipse cx="0" cy="3.4" rx="3.5" ry="1.3" fill="#0006"/><path d="M-3.2 3 Q-3.2 -0.4 -1.2 -1.4 A2.4 2.4 0 1 1 1.2 -1.4 Q3.2 -0.4 3.2 3 Z" fill="${cor}" stroke="#0007" stroke-width=".35"/><path d="M-3.2 3 Q-3.2 -0.4 -1.2 -1.4 A2.4 2.4 0 1 1 1.2 -1.4 Q3.2 -0.4 3.2 3 Z" fill="url(#brilho)"/><text y="1.7" font-size="3.4" text-anchor="middle">${jog.pawn}</text></g>`;
}
function desenharTabuleiro() {
  if (!camadas || rodadaVista !== S.code + S.game.n) { montarTabuleiro(); rodadaVista = S.code + S.game.n; camadas.peao.innerHTML = ""; }
  const g = jogoAtual(), vez = minhaVez(), lugs = B.lugaresDe(g.n), tem = g.sobram[eu()] > 0;
  // as metas de cada um, em faixas coloridas nas bordas
  camadas.meta.innerHTML = g.metas.map((m, i) => { const cor = CORES[lugs[i]]; return m.r != null ? `<rect x="2" y="${m.r === 0 ? 0 : 100 - 1.6}" width="96" height="1.6" rx=".8" fill="${cor}"/>` : `<rect x="${m.c === 0 ? 0 : 100 - 1.6}" y="2" width="1.6" height="96" rx=".8" fill="${cor}"/>`; }).join("");
  // a última jogada: casa brilhando
  const u = g.ultima;
  camadas.ult.innerHTML = u && u.tipo === "mover" ? `<rect class="rastro" x="${u.c * SZ + 0.9}" y="${u.r * SZ + 0.9}" width="${SZ - 1.8}" height="${SZ - 1.8}" rx="1.4" fill="#fff6"/>` : "";
  // as paredes: só a que acabou de cair anima
  const jaTinha = paredesVistas;
  camadas.par.innerHTML = g.paredes.map((w, k) => paredeSVG(w, "url(#par)", `class="parede ${k >= jaTinha && jaTinha > 0 ? "nova" : ""}" stroke="#0008" stroke-width=".25"`)).join("");
  if (g.paredes.length > paredesVistas && jaTinha > 0) Som.tocar("parede");
  paredesVistas = g.paredes.length;
  // as casas para onde posso ir
  camadas.dica.innerHTML = vez && modo === "mover" ? B.movimentos(g, eu()).map((m) => { const [x, y] = centro(m.r, m.c); return `<circle class="dica-casa" cx="${x}" cy="${y}" r="${SZ * 0.2}" fill="${CORES[lugs[eu()]]}" stroke="#fff" stroke-width=".5" style="pointer-events:none"/><rect class="dest" data-r="${m.r}" data-c="${m.c}" x="${m.c * SZ}" y="${m.r * SZ}" width="${SZ}" height="${SZ}" fill="transparent" style="cursor:pointer"/>`; }).join("") : "";
  camadas.dica.querySelectorAll(".dest").forEach((e) => (e.onclick = () => act("move", { r: +e.dataset.r, c: +e.dataset.c })));
  // os espaços para pôr parede (só os que valem); passar o mouse acende a parede de verdade
  let sl = "";
  if (vez && modo === "parede" && tem) for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) for (const o of ["h", "v"]) { const w = { r, c, o }; if (!B.erroDaParede(g, w)) sl += paredeSVG(w, "#fff0", `class="slot" data-r="${r}" data-c="${c}" data-o="${o}" style="cursor:pointer"`, 3.6); }
  camadas.slot.innerHTML = sl;
  camadas.slot.querySelectorAll(".slot").forEach((e) => {
    e.onmouseenter = () => { e.setAttribute("fill", "#f5b93c"); e.setAttribute("opacity", ".9"); };
    e.onmouseleave = () => { e.setAttribute("fill", "#fff0"); e.removeAttribute("opacity"); };
    e.onclick = () => act("wall", { r: +e.dataset.r, c: +e.dataset.c, o: e.dataset.o });
  });
  // os peões ficam e deslizam (a transição do CSS cuida do movimento)
  g.peoes.forEach((p, i) => {
    let el = camadas.peao.querySelector(`[data-i="${i}"]`);
    if (!el) { el = document.createElementNS(NS, "g"); el.setAttribute("data-i", i); el.classList.add("peao"); el.innerHTML = peaoSVG(i, S.players[i], lugs[i]); camadas.peao.appendChild(el); }
    const [x, y] = centro(p.r, p.c), antes = el.dataset.pos;
    el.style.transform = `translate(${x}px, ${y}px)`;
    if (antes && antes !== p.r + "," + p.c) Som.tocar("passo");
    el.dataset.pos = p.r + "," + p.c;
    el.classList.toggle("vez", S.phase === "playing" && g.vez === i);
  });
}
$("modo").querySelectorAll("button").forEach((b) => (b.onclick = () => { modo = b.dataset.m; desenharJogo(); }));

function desenharJogo() {
  const g = S.game, vez = minhaVez(), lugs = B.lugaresDe(g.n), total = B.PAREDES_POR_JOGADOR[g.n];
  $("modo").classList.toggle("hidden", !(S.phase === "playing" && eu() >= 0));
  if (!vez) modo = "mover";
  $("modo").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.m === modo));
  $("modo").querySelector('[data-m="parede"]').disabled = !vez || g.sobram[eu()] <= 0;
  $("dica").textContent = S.phase !== "playing" ? "" : eu() < 0 ? "Você está assistindo." : !vez ? `Vez de ${S.players[g.vez].name}…` : modo === "mover" ? "Toque numa casa marcada para andar." : "Passe o mouse (ou toque) onde quer a parede: ela fecha duas casas.";
  $("cards").innerHTML = S.players.map((p, i) => `<div class="pc ${g.vez === i && S.phase === "playing" ? "vez" : ""} ${p.online ? "" : "off"}" style="--cor:${CORES[lugs[i]]}"><span class="cor"></span><span style="font-size:22px">${p.pawn}</span><span class="nm">${h(p.name)}${ME && p.id === ME.id ? " (você)" : ""}</span><span class="paredes" title="Paredes que sobram">${Array.from({ length: total }, (_, k) => `<i class="${k >= g.sobram[i] ? "gasta" : ""}"></i>`).join("")}</span>${S.wins[p.id] ? `<span title="Vitórias">🏆${S.wins[p.id]}</span>` : ""}</div>`).join("");
  $("log").innerHTML = S.log.slice().reverse().map((l) => `<div>${h(l.text)}</div>`).join("");
  const fim = $("fim"), host = ME && S.host === ME.id;
  fim.classList.toggle("hidden", S.phase !== "ended");
  if (S.phase === "ended") {
    const w = S.players.find((p) => p.id === S.winner);
    fim.innerHTML = `<h2>👑 ${h(w ? w.name : "?")} ganhou!</h2>${host ? `<div class="row" style="justify-content:center"><button class="primary" id="bAgain">Jogar de novo</button><button id="bLobby">Sala de espera</button></div>` : `<p class="muted">Esperando o organizador…</p>`}`;
    if (host) { $("bAgain").onclick = () => act("again"); $("bLobby").onclick = () => act("restart"); }
  }
  desenharTabuleiro();
}
function tique() {
  const d = S && S.deadline;
  $("tempo").style.width = d && S.phase === "playing" ? Math.max(0, Math.min(100, ((d.at - relogio.agora()) / d.total) * 100)) + "%" : "0";
  requestAnimationFrame(tique);
}
tique();
let vezAnterior = null, fimVisto = null, primeiro = true;
socket.on("state", (st) => {
  relogio.doEstado(st.now); S = st;
  if (st.phase === "lobby") { mostrar("lobby"); desenharLobby(); return; }
  mostrar("jogo");
  const chave = st.game.vez + "|" + st.game.paredes.length + "|" + st.game.peoes.map((p) => p.r + "," + p.c).join(";");
  const euVez = minhaVez();
  if (euVez && chave !== vezAnterior) { toast("Sua vez!", 1200); Som.tocar("vez"); }
  vezAnterior = chave;
  desenharJogo();
  if (st.phase === "ended") {
    const k = st.code + "|" + st.winner + "|" + Object.values(st.wins).join(",");
    if (fimVisto !== k) { if (fimVisto !== null || !primeiro) { Som.tocar("vitoria"); Comum.confetti(["#f5b93c", "#ff8a3d", "#4fb0ff", "#6ee7a0", "#c58bff"]); } fimVisto = k; }
  } else fimVisto = "";
  primeiro = false;
});
</script>
