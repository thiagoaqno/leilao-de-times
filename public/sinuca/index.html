<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<script src="/semzoom.js"></script>
<title>Sinuca da Galera</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabin+Sketch:wght@400;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* boteco à noite: luz baixa em cima do pano verde, madeira escura e metal dourado */
  --bg:#0a110e;--bg2:#0f1a15;--panel:#12201a;--panel2:#172a22;--line:#233a2f;
  --text:#eef5ef;--muted:#98b0a2;--gold:#e9b949;--gold2:#a87c16;--bad:#ff6b6b;--good:#5ee39a;
  --felt:#1b7a4b;--wood:#6b3f22;
  --tA:#ffae42;--tB:#56b4ff;
  --radius:16px;
  --display:"Bebas Neue",Impact,system-ui,sans-serif;
  --body:Figtree,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body)}
body{min-height:100vh;background:radial-gradient(1100px 520px at 50% -160px,#1d3a2b 0%,transparent 70%),var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:1;margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;padding:10px 16px;background:#1d3329;color:var(--text);border:1px solid #2f4b3e;box-shadow:0 3px 0 #06100b;transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #06100b}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
button.small{padding:6px 11px;font-size:13px;border-radius:10px}
input,select{font:inherit;color:var(--text);background:#07100c;border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.hidden{display:none!important}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px;font-weight:600}
.card-ui{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.wrap{max-width:1400px;margin:0 auto;padding:14px 16px 60px}

/* cabeçalho */
.bar{position:sticky;top:0;z-index:20;background:#0a110eee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand h1{font-size:27px;white-space:nowrap;padding-top:3px}
.brand .b8{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#555 0,#111 55%,#000 100%);display:grid;place-items:center;flex:none}
.brand .b8 i{width:12px;height:12px;border-radius:50%;background:#fff;color:#000;font:800 9px/12px var(--body);font-style:normal;text-align:center}
.tovila{flex:none;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px;padding:6px 10px 6px 4px;border-radius:10px;white-space:nowrap}
.tovila:hover{color:var(--text)}
.roomtag{display:flex;align-items:center;gap:8px}
.roomtag .code{font:26px var(--display);letter-spacing:.12em;color:var(--gold);padding-top:3px}
.sm{display:none}
@media (max-width:640px){.lg{display:none}.sm{display:inline}.brand h1{font-size:22px}.inroom .brand h1{display:none}.roomtag .lbl{display:none}}

/* início */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;min-height:calc(100vh - 140px)}
.hero h2{font-size:clamp(54px,8vw,96px);line-height:.9}
/* entrada e sala de espera: lousa de giz do bar, com moldura de madeira */
.lousa{--line:#ffffff2e;--muted:#c9d3cb;position:relative;background:radial-gradient(260px 140px at 20% 15%,#ffffff12,transparent 70%),radial-gradient(300px 160px at 85% 80%,#ffffff0d,transparent 70%),linear-gradient(160deg,#27342d,#1c2621);border:12px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 0 2px #3f2614,inset 0 0 30px #0008,0 22px 44px #000a;padding:22px}
.lousa h2,.lousa .giz{font-family:"Cabin Sketch",var(--display);font-weight:700;color:#f3f1ea;letter-spacing:.01em;line-height:1.05}
.lousa .giz{font-size:30px;margin:0 0 14px;display:flex;align-items:center;gap:14px}
.lousa label{font-family:"Cabin Sketch",var(--body);font-size:17px;color:#e8e4d8;font-weight:400}
.lousa input,.lousa select{background:#ffffff08;border:0;border-bottom:2px dashed #ffffff8c;border-radius:0;color:#fbf9f2;padding:8px 4px}
.lousa select option{background:#1c2621}
.lousa input:focus,.lousa select:focus{outline:none;border-bottom:2px solid #8fc1ff;background:#ffffff10}
.lousa .codein{font-family:"Cabin Sketch",var(--display);font-weight:700;font-size:32px}
/* as marquinhas de placar a giz: quatro riscos e um cortando */
.tally{position:relative;display:inline-block;width:34px;height:24px;background:repeating-linear-gradient(90deg,#f3f1ea 0 3px,transparent 3px 8px);opacity:.75;border-radius:1px}
.tally::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:3px;background:#f3f1ea;transform:rotate(-24deg)}
/* botão principal: o giz azul do taco, com a covinha no meio */
button.primary{background:#2f6fd1;color:#fff;border-color:#5b93e6;box-shadow:inset 0 0 0 5px #2f6fd1,inset 0 0 14px 8px #1f55a8,0 4px 0 #1a4588;border-radius:8px}
button.primary:active:not(:disabled){box-shadow:inset 0 0 0 5px #2f6fd1,inset 0 0 14px 8px #1f55a8,0 1px 0 #1a4588}
.hero p.lead{color:var(--muted);font-size:17px;max-width:470px;margin:14px 0 0}
.hero .art{margin-top:26px;max-width:480px}
.hero .art canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 20px 30px #000a)}
.codein{text-transform:uppercase;letter-spacing:.3em;font:30px var(--display);text-align:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
@media (max-width:820px){.hero{grid-template-columns:1fr;min-height:0;padding-top:10px}.hero .art{max-width:360px}}

/* sala de espera */
.lobby{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.lobby{grid-template-columns:1fr}}
.lobby h2{font-size:34px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.teams{grid-template-columns:1fr}}
.team{border:1px solid var(--line);border-radius:14px;padding:12px;background:#0c1712}
.team h3{font-size:24px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.team h3 i{width:12px;height:12px;border-radius:50%;display:inline-block}
.team.tA h3 i{background:var(--tA)}.team.tB h3 i{background:var(--tB)}
.team.tA{border-color:#6a4a1f}.team.tB{border-color:#23506f}
.lseat{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel2);margin-bottom:8px;min-height:52px}
.lseat .av{font-size:26px;width:36px;text-align:center}
.lseat b{display:block;line-height:1.2}
.lseat small{color:var(--muted);font-size:12.5px}
.lseat .grow{flex:1;min-width:0}
.lseat.empty{border:1px dashed var(--line);background:transparent;color:var(--muted);justify-content:center;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px}
.dot.off{background:#555}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{font-size:22px;padding:4px 8px;box-shadow:none}
.picker button.on{background:var(--gold);border-color:var(--gold)}
.picker button.taken{opacity:.25}
.seg{display:flex;background:#07100c;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;box-shadow:none;border:0;background:transparent;color:var(--muted);padding:9px 8px}
.seg button.on{background:var(--gold);color:#2a1d02}
.seg button:disabled{opacity:.6}
.field{margin-top:14px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

/* jogo */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:10px}
.side{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0;position:relative;transition:box-shadow .2s,border-color .2s}
.side.right{flex-direction:row-reverse;text-align:right}
.side.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px #e9b94933}
.side .avs{display:flex;flex:none}
.side .avs .pv{width:40px;height:40px;border-radius:50%;background:#0a1510;border:2px solid #2d4a3c;display:grid;place-items:center;font-size:22px;position:relative}
.side .avs .pv + .pv{margin-left:-10px}
.side.right .avs .pv + .pv{margin-left:0;margin-right:-10px}
.side.right .avs{flex-direction:row-reverse}
.side .avs .pv.shoot{border-color:var(--gold);z-index:2}
.side .avs .pv.off{filter:grayscale(1);opacity:.6}
.side .avs .pv svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}
.side .info{min-width:0;flex:1}
.side .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.side .nm .cur{color:var(--gold)}
.side .grp{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;align-items:center;min-height:18px;font-size:12px;color:var(--muted)}
.side.right .grp{justify-content:flex-end}
.side .grp canvas{width:17px;height:17px}
.side .grp canvas.gone{opacity:.18}
.side .tagteam{position:absolute;top:-1px;left:14px;height:3px;width:40px;border-radius:0 0 3px 3px}
.side.right .tagteam{left:auto;right:14px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 10px;min-width:110px}
.mid .sc{font:44px/1 var(--display);letter-spacing:.04em}
.mid .sc span{color:var(--muted);margin:0 6px}
.mid small{color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:640px){
  .hud{grid-template-columns:1fr auto 1fr;gap:6px}
  .side{padding:6px 8px;gap:6px;flex-direction:column;align-items:flex-start}
  .side.right{flex-direction:column;align-items:flex-end}
  .side .avs .pv{width:32px;height:32px;font-size:18px}
  .side .nm{font-size:13px}
  .side .grp canvas{width:13px;height:13px}
  .mid{min-width:70px;padding:0}.mid .sc{font-size:34px}
}

.stage{display:flex;gap:12px;align-items:center;justify-content:center;position:relative}
.stage.rot{flex-direction:column;gap:8px}
.tablebox{position:relative;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
#table{display:block;border-radius:22px;cursor:crosshair}
.tools{display:flex;flex-direction:column;gap:12px;align-items:center;flex:none}
.stage.rot .tools{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:8px 12px;width:100%;max-width:520px;align-items:center}
.stage.rot .tools > :first-child{grid-row:1 / span 2}
.stage.rot .fine{width:auto}
.spin{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0,#e9e9e9 45%,#a9a9a9 100%);position:relative;cursor:pointer;touch-action:none;box-shadow:0 6px 16px #0008;flex:none}
.spin::before,.spin::after{content:"";position:absolute;background:#0002}
.spin::before{left:50%;top:10%;bottom:10%;width:1px}
.spin::after{top:50%;left:10%;right:10%;height:1px}
.spin i{position:absolute;width:14px;height:14px;border-radius:50%;background:#e02b2b;border:2px solid #fff;box-shadow:0 1px 3px #0009;transform:translate(-50%,-50%);left:50%;top:50%;pointer-events:none}
.spinlbl{font-size:11px;color:var(--muted);text-align:center;margin-top:-6px;font-weight:700;letter-spacing:.06em}
.power{position:relative;width:46px;border-radius:23px;background:#07100c;border:1px solid var(--line);touch-action:none;cursor:grab;overflow:hidden;flex:none}
.power .fill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(180deg,#ffe07a,#ff8a3d 60%,#ff3d3d)}
.power .stick{position:absolute;left:50%;top:6px;bottom:6px;width:10px;transform:translateX(-50%);border-radius:5px;background:linear-gradient(180deg,#3b82f6 0 4px,#f5ecd7 4px 16px,#e2c48f 16px 58%,#4a2410 58%,#2b1408);box-shadow:0 2px 6px #000a;transition:transform .05s}
.power .lbl{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:18px var(--display);color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.power.off{opacity:.35;cursor:not-allowed}
.stage.rot .power{width:auto;height:46px}
.stage.rot .power .fill{top:0;bottom:0;height:auto;width:0;left:auto;right:0;background:linear-gradient(270deg,#ffe07a,#ff8a3d 60%,#ff3d3d)}
.stage.rot .power .stick{top:50%;bottom:auto;left:6px;right:6px;width:auto;height:10px;transform:translateY(-50%);background:linear-gradient(90deg,#2b1408,#4a2410 42%,#e2c48f 42%,#f5ecd7 calc(100% - 16px),#3b82f6 calc(100% - 4px))}
.stage.rot .power .lbl{bottom:auto;top:50%;transform:translateY(-50%)}
.shootbtn{display:none}

.below{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.status{flex:1;min-width:220px;text-align:center;font-weight:700;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-height:42px}
.status.mine{border-color:var(--gold);color:#fff;background:linear-gradient(180deg,#2a2610,#1b1a0c)}
.status.foul{border-color:#8a2b2b;background:#2a1111}
.fine{width:190px;height:38px;border-radius:10px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,#1c3027 0 2px,#0c1712 2px 9px);touch-action:none;cursor:ew-resize;position:relative;flex:none}
.fine::after{content:"ajuste fino";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;pointer-events:none;text-shadow:0 1px 2px #000}
.fine.off{opacity:.35}
.reacts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.reacts button{font-size:19px;padding:4px 8px;box-shadow:none;background:transparent;border-color:var(--line)}

.sidegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media (max-width:760px){.sidegrid{grid-template-columns:1fr}}
.sidegrid h3{font-size:24px;margin-bottom:10px}
.log{max-height:230px;overflow:auto;font-size:13.5px;display:flex;flex-direction:column-reverse;gap:3px}
.log div{color:var(--muted)}
.log div:first-child{color:var(--text)}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;background:var(--panel2)}
.rank .it.cur{outline:1px solid var(--gold)}
.rank .it .av{font-size:20px}
.rank .it b{flex:1}
.rank .it .w{font:22px var(--display);color:var(--gold)}
.bracket{display:flex;gap:12px;overflow-x:auto}
.bracket .col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:150px}
.bracket .col h4{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bracket .mt{background:var(--panel2);border-radius:10px;padding:6px 8px;font-size:13.5px;border:1px solid transparent}
.bracket .mt.now{border-color:var(--gold)}
.bracket .mt div{display:flex;gap:6px;align-items:center;white-space:nowrap}
.bracket .mt div.win{color:var(--gold);font-weight:800}
.bracket .mt div.lose{opacity:.5;text-decoration:line-through}

/* resultado em cima da mesa */
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(closest-side,#000c,#0008);border-radius:22px;z-index:5;padding:16px;animation:fadein .3s}
.overlay .box{text-align:center;max-width:460px}
.overlay .big{font:clamp(34px,6vw,58px)/1 var(--display);color:var(--gold);letter-spacing:.03em}
.overlay .who{font-size:44px;margin:8px 0}
.overlay p{margin:8px 0;color:#dfe9e2}
.overlay .sc{font:40px var(--display);margin:6px 0}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.floaty{position:fixed;z-index:60;pointer-events:none;font-size:34px;animation:floaty 1.6s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes floaty{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.banner{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:4;pointer-events:none;font:clamp(26px,4.5vw,46px)/1 var(--display);letter-spacing:.05em;padding:8px 22px;border-radius:14px;background:#000b;color:#fff;white-space:nowrap;animation:bannerIn 1.8s ease forwards}
.banner.foul{color:#ff8c8c}
.banner.gold{color:var(--gold)}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}

.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:620px;width:100%;max-height:88vh;overflow:auto}
.modal h2{font-size:34px;margin-bottom:8px}
.modal h3{font-size:22px;margin:16px 0 6px;color:var(--gold)}
.modal ul{margin:0;padding-left:20px}
.modal li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1f332a;border:1px solid #365446;padding:10px 18px;border-radius:12px;font-weight:700;z-index:70;max-width:92vw;text-align:center;box-shadow:0 10px 30px #000a}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:65;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="tovila" href="/" title="Voltar para a vila">← Vila</a>
    <div class="brand"><div class="b8"><i>8</i></div><h1>Sinuca da Galera</h1></div>
    <div class="roomtag hidden" id="roomTag"><span class="lbl muted">Mesa</span><span class="code" id="rCode"></span><button class="small" id="btnInvite" title="Copiar convite"><span class="lg">Convidar</span><span class="sm">🔗</span></button></div>
    <button class="ghost small" id="btnSound" title="Som">🔊</button>
    <button class="ghost small" id="btnRules" title="Regras"><span class="lg">Regras</span><span class="sm">❔</span></button>
  </div>
</header>

<div class="wrap">
  <section id="home" class="hidden">
    <div class="hero">
      <div>
        <h2>Bola 8<br>sem pagar a ficha</h2>
        <p class="lead">Sinuca no estilo 8 Ball Pool, de 2 a 8 jogadores: em duplas ou cada um por si, no rei da mesa ou no mata-mata. Cria a mesa, manda o link e passa o giz.</p>
        <div class="art"><canvas id="heroArt" width="960" height="540"></canvas></div>
      </div>
      <div class="card-ui lousa">
        <h3 class="giz">Mesa da galera <span class="tally" aria-hidden="true"></span></h3>
        <label for="hName">Seu nome</label>
        <input id="hName" maxlength="8" placeholder="Ex.: Kizzy" autocomplete="off">
        <label for="hCode" style="margin-top:14px">Código da mesa</label>
        <input id="hCode" class="codein" maxlength="5" placeholder="ABCDE" autocomplete="off">
        <div class="row" style="margin-top:14px"><button class="primary" id="btnJoin">Entrar</button><button class="ghost" id="btnWatch">Só assistir</button></div>
        <div class="or">ou</div>
        <button id="btnCreate" style="width:100%">Criar mesa nova</button>
        <div class="err" id="hErr"></div>
      </div>
    </div>
  </section>

  <section id="lobby" class="hidden">
    <div class="lobby">
      <div class="card-ui lousa">
        <h2>Quem vai jogar</h2>
        <div id="seats"></div>
        <div id="myPick" class="hidden" style="margin-top:18px"><label>Seu avatar</label><div class="picker" id="pawnPick"></div></div>
      </div>
      <div class="card-ui lousa">
        <h2>Regras da mesa</h2>
        <div id="cfg"></div>
        <div id="startBox" style="margin-top:18px"></div>
      </div>
    </div>
  </section>

  <section id="game" class="hidden">
    <div class="hud" id="hud"></div>
    <div class="stage" id="stage">
      <div class="tablebox" id="tablebox">
        <canvas id="table"></canvas>
        <div id="overlay"></div>
        <div id="bannerBox"></div>
      </div>
      <div class="tools" id="tools">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div class="spin" id="spin" title="Efeito: toque onde o taco vai bater na branca (duplo clique zera)"><i id="spinDot"></i></div>
          <div class="spinlbl">EFEITO</div>
        </div>
        <div class="power off" id="power" title="Puxe para trás e solte para bater"><div class="fill" id="powerFill"></div><div class="stick" id="powerStick"></div><div class="lbl" id="powerLbl"></div></div>
      </div>
    </div>
    <div class="below" id="below">
      <div class="fine off" id="fine" title="Arraste para ajustar a mira bem devagar"></div>
      <div class="status" id="status"></div>
      <div class="reacts hidden" id="reacts"></div>
    </div>
    <div class="sidegrid">
      <div class="card-ui"><h3 id="sideTitle">Placar</h3><div id="sideBox"></div></div>
      <div class="card-ui"><h3>Acontecendo</h3><div class="log" id="log"></div></div>
    </div>
  </section>
</div>

<div class="modal hidden" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast hidden" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/noite.js"></script>
<script src="/comum.js"></script>
<script src="/sinuca/fisica.js"></script>
<script src="/sinuca/sala.js"></script>
<script src="/sinuca/mesa.js"></script>
<script src="/sinuca/mira.js"></script>
<script src="/sinuca/desenho.js"></script>
<script src="/sinuca/extras.js"></script>
</body>
</html>
