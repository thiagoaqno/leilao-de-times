<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<script src="/semzoom.js"></script>
<title>Vila da Galera</title>
<link rel="icon" href="/emblema.svg" type="image/svg+xml">
<script>
  // links antigos do leilão (/?sala=ABCDE) agora vivem em /leilao/
  if (new URLSearchParams(location.search).get("sala")) location.replace("/leilao/" + location.search);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Pixelify+Sans:wght@500;700&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10183d;--paper:#fffdf5;--line:#2b3a7a;--gold:#ffc83d;--night:#0a1233}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#12301c;color:#fff;font:15px/1.4 Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto;background:#0a1233cc;border:2px solid #ffffff22;border-radius:14px;padding:6px 14px 6px 8px;backdrop-filter:blur(4px)}
.brand img{width:30px;height:34px}
.brand h1{margin:0;font:400 24px/1 "Lilita One",sans-serif;letter-spacing:.01em}
.brand h1 span{color:var(--gold)}
.brand small{display:block;font:600 12px Figtree,sans-serif;color:#9fb0d9;margin-top:3px}
.brand small b{color:#5fe39a}
.nick{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:6}
.nick.on{display:grid}
.nick form{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:12px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px #c9d4f0;padding:18px;width:min(360px,100%);font-family:"Pixelify Sans",monospace}
.nick h2{margin:0 0 4px;font:700 21px "Pixelify Sans",monospace}
.nick p{margin:0 0 12px;color:#4a5690;font-size:15px}
.nick input{width:100%;font:700 22px "Pixelify Sans",monospace;padding:8px 12px;border:3px solid var(--ink);border-radius:8px;color:var(--ink);background:#fff;text-align:center}
.nick button{margin-top:12px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px;font:700 17px "Pixelify Sans",monospace;box-shadow:0 3px 0 #000}
.toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:9}
.toast{background:#0a1233e6;border:2px solid #ffffff33;border-radius:10px;padding:6px 12px;font:500 15px "Pixelify Sans",monospace;white-space:nowrap;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
.tools{display:flex;gap:8px;pointer-events:auto}
.tbtn{background:#0a1233cc;color:#fff;border:2px solid #ffffff22;border-radius:12px;padding:8px 12px;font-weight:700;backdrop-filter:blur(4px)}
.tbtn:hover{border-color:#ffffff55}

.hint{position:fixed;left:14px;bottom:14px;font:500 14px "Pixelify Sans",monospace;background:#0a1233bb;border-radius:10px;padding:6px 10px;color:#dfe7fb;pointer-events:none}
.hint kbd{display:inline-block;background:#fff;color:var(--ink);border-radius:4px;padding:0 5px;margin:0 1px;box-shadow:0 2px 0 #8e9cc4;font:700 12px "Pixelify Sans",monospace}

/* caixa de diálogo estilo RPG */
.dlg{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);width:min(560px,calc(100% - 24px));background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:12px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px #c9d4f0,0 10px 0 #0006;padding:16px 18px 14px;font:500 17px/1.35 "Pixelify Sans",monospace;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.dlg h2{margin:0 0 4px;font:700 22px/1.1 "Pixelify Sans",monospace;display:flex;align-items:center;gap:8px}
.dlg p{margin:0}
.dlg .meta{color:#4a5690;font-size:15px;margin-top:4px}
.telao-top{margin:6px 0 0;padding:0;list-style:none;counter-reset:t}
.telao-top li{counter-increment:t;display:flex;align-items:baseline;gap:6px;padding:2px 0;border-bottom:1px dashed #c9d4f0}
.telao-top li::before{content:counter(t) "º";min-width:24px;font-weight:700;color:#4a5690}
.telao-top li:nth-child(1)::before{color:#b8860b}.telao-top li:nth-child(2)::before{color:#7a8496}.telao-top li:nth-child(3)::before{color:#a0522d}
.telao-top i{margin-left:auto;font-style:normal;font-size:14px;white-space:nowrap}
.dlg .go{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.dlg .go span{font-size:15px;color:#4a5690}
.dlg .go span::after{content:" ▼";display:inline-block;animation:blink 1s steps(2) infinite}
.dlg button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:700 16px "Pixelify Sans",monospace;box-shadow:0 3px 0 #000}
.dlg button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
@keyframes blink{to{visibility:hidden}}

/* controles de toque */
.pad{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));display:none;touch-action:none;user-select:none;-webkit-user-select:none}
.touch .pad{display:grid}
.touch .hint{display:none}
.touch.talking .pad.dir{opacity:.35}
.talking .hint{display:none}
.dir{left:14px;grid-template:repeat(3,48px)/repeat(3,48px)}
.dir button{background:#0a1233aa;border:2px solid #ffffff33;color:#fff;border-radius:10px;font-size:18px;touch-action:none}
.dir button.on{background:#ffffff44}
.dir .u{grid-area:1/2}.dir .l{grid-area:2/1}.dir .r{grid-area:2/3}.dir .d{grid-area:3/2}
.ab{right:14px;grid-template-columns:auto auto;gap:12px;align-items:end}
.ab button{width:62px;height:62px;border-radius:50%;border:3px solid #ffffff55;background:#e0352bdd;color:#fff;font:700 22px "Pixelify Sans",monospace;touch-action:none}
.ab .b{width:50px;height:50px;background:#2b3a7add;font-size:18px;margin-bottom:24px}
.ab button.on{filter:brightness(1.3)}
.touch .dlg{bottom:calc(max(16px,env(safe-area-inset-bottom)) + 168px)}

/* menu de atalho */
.menu{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:5}
.menu.on{display:grid}
.menu .box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:12px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 6px #c9d4f0;padding:16px;width:min(380px,100%);font-family:"Pixelify Sans",monospace}
.menu h2{margin:0 0 10px;font:700 20px "Pixelify Sans",monospace}
.menu a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
.menu a:hover,.menu a:focus-visible{background:#e6ecff}
.menu h3{margin:10px 0 2px;padding:3px 8px;display:inline-block;font:700 13px "Pixelify Sans",monospace;color:#fff;background:#1f4fa3;border-radius:3px;box-shadow:inset 0 0 0 1.5px #1f4fa3,inset 0 0 0 2.5px #f4f6fb}
.menu h3:first-child{margin-top:0}
#menuList{max-height:70vh;overflow:auto}
#salasBox{margin-bottom:6px}#salasBox:empty{display:none}
.menu a.sala{flex-wrap:wrap;gap:2px 10px;font-size:16px;background:#f4f6fb;margin:3px 0}.menu a.sala:hover,.menu a.sala:focus-visible{background:#e6ecff}
.menu a.sala .quem{flex-basis:100%;font:500 13px Figtree,system-ui,sans-serif;color:#4a5690;margin-top:-2px}
.menu a.sala .tag{margin-left:auto;font:700 12px "Pixelify Sans",monospace;padding:2px 7px;border-radius:99px;background:#2e9d5b;color:#fff}.menu a.sala .tag.cheia{background:#b8862b}.menu a.sala .tag.jogando{background:#7a85b0}
.tbtn .badge{margin-left:4px;min-width:18px;padding:0 5px;border-radius:99px;background:#2e9d5b;color:#fff;font:700 12px/18px "Pixelify Sans",monospace;display:none;text-align:center}.tbtn .badge.on{display:inline-block}
.menu a small{margin-left:auto;font-weight:500;color:#4a5690;font-size:13px}
.menu .x{margin-top:8px;width:100%;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px;font:700 16px "Pixelify Sans",monospace}

/* ---------- Galeramon ---------- */
.menu .box.wide{width:min(760px,100%);max-height:92vh;overflow:auto}
.menu .row2{display:flex;gap:8px;margin-top:10px}
.menu .row2 button{flex:1;border:0;border-radius:8px;padding:10px;font:700 16px "Pixelify Sans",monospace;background:#e6ecff;color:var(--ink)}
.menu .row2 button.go{background:var(--ink);color:#fff;box-shadow:0 3px 0 #000}
.menu .row2 button:disabled{opacity:.4}
.desafio-escolhas{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
#popBox{max-height:calc(100dvh - 32px);overflow:auto}
.desafio-escolhas button{flex:1;min-height:44px;border:2px solid #c9d4f0;border-radius:6px;padding:8px;font:700 15px "Pixelify Sans",monospace;background:#fff;color:var(--ink);touch-action:manipulation}
.desafio-escolhas button[aria-pressed="true"]{border-color:#187b66;background:#dbf2e9}
.desafio-escolhas button:active{background:#c5e5d9}
.menu .row2.desafio-acao{flex-direction:column}
.desafio-acao button{min-height:44px;touch-action:manipulation}
.desafio-acao button:active{filter:brightness(.9)}
.menu p{margin:0 0 6px}
.tchip{display:inline-block;color:#fff;border-radius:5px;padding:0 6px;font:700 12px/18px "Pixelify Sans",monospace;text-shadow:0 1px 0 #0006}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{position:relative;background:#fff;border:3px solid #c9d4f0;border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-family:"Pixelify Sans",monospace;color:var(--ink)}
.mcard.sel{border-color:var(--ink);background:#fff8dd}
.mcard img{width:72px;height:72px;image-rendering:pixelated;display:block;margin:0 auto}
.mcard b{display:block;font-size:16px}
.mcard .n{position:absolute;top:4px;left:6px;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;font:700 13px/22px "Pixelify Sans";display:none}
.mcard.sel .n{display:block}
.minfo{margin-top:10px;background:#f1f4ff;border-radius:10px;padding:10px 12px;font-size:15px;min-height:96px}
.minfo .mvs{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:6px;font-size:14px}
.minfo .bars{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:13px;margin-top:6px}
.minfo .bars i{display:block;height:6px;border-radius:3px;background:var(--ink)}

.bt{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;background:#10183d;font-family:"Pixelify Sans",monospace;color:var(--ink)}
.bt.on{display:flex}
.arena{flex:1;position:relative;overflow:hidden;min-height:250px;background:linear-gradient(#7ec8f5 0,#bfe6ff 42%,#9fd87a 42%,#86c865 100%)}
.arena::before{content:"";position:absolute;left:0;right:0;top:42%;height:6px;background:#6fb452}
.spot{position:absolute;display:flex;flex-direction:column;align-items:center}
.spot .mon{width:min(26vw,24vh,170px);aspect-ratio:1;image-rendering:pixelated;position:relative;z-index:1;margin-bottom:-14%}
.spot .plat{width:min(38vw,36vh,250px);height:min(8vw,7vh,54px);border-radius:50%;background:#78c55a;box-shadow:inset 0 -6px 0 #57a13f,0 0 0 3px #4f9a3a55}
.spot.foe{right:5%;top:9%}
.spot.me{left:3%;bottom:3%}
.spot.me .mon{width:min(32vw,30vh,220px);transform:scaleX(-1)}
.spot .mon.ds{width:min(32vw,30vh,212px)}
.spot.me .mon.ds{width:min(40vw,37vh,275px)}
.spot .mon.lunge{animation:lunge .35s}
.spot.me .mon.lunge{animation:lungeMe .35s}
.spot .mon.hit{animation:hit .5s steps(2)}
.spot .mon.faint{animation:faint .6s forwards}
.spot .mon.in{animation:pin .35s ease-out}
@keyframes lunge{50%{transform:translate(-18px,10px)}}
@keyframes lungeMe{50%{transform:scaleX(-1) translate(-18px,-10px)}}
@keyframes hit{0%,50%{opacity:.15}25%,75%{opacity:1}}
@keyframes faint{to{transform:translateY(40%);opacity:0}}
@keyframes pin{from{transform:scale(.2);opacity:0}}
.spot.me .mon.in{animation:pinMe .35s ease-out}
@keyframes pinMe{from{transform:scaleX(-1) scale(.2);opacity:0}}
.ibox{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:0 4px 0 #0004;padding:6px 10px 8px;width:min(46vw,300px);z-index:2}
.ibox.foe{left:3%;top:6%}
.ibox.me{right:3%;bottom:8%}
.ibox .ihead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:700;font-size:17px}
.ibox .ihead small{font-weight:500;font-size:13px;color:#4a5690;white-space:nowrap}
.ibox .hp{display:flex;align-items:center;gap:6px;margin-top:4px;font:700 12px "Pixelify Sans"}
.ibox .bar{flex:1;height:9px;background:#3c4466;border-radius:5px;overflow:hidden;border:2px solid var(--ink)}
.ibox .bar i{display:block;height:100%;background:#3ed06d;transition:width .6s ease-out,background .3s}
.ibox .bar i.mid{background:#f2c027}.ibox .bar i.low{background:#e8483b}
.ibox .chakra{font:700 12px "Pixelify Sans";color:#3972a7;margin-top:3px}
.ibox .sub{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:3px;font-size:13px;color:#4a5690;min-height:18px}
.ibox .balls{letter-spacing:1px}
.ibox .st{font-size:12px;color:#4a5690}
.bpanel{background:var(--paper);border-top:4px solid var(--ink);padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;gap:10px}
.bmsg{font:500 18px/1.35 "Pixelify Sans",monospace;min-height:48px;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;background:#fff;box-shadow:inset 0 0 0 2px #c9d4f0}
.bmoves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bmoves button{border:0;border-radius:10px;padding:8px 10px;color:#fff;text-align:left;font:700 16px/1.15 "Pixelify Sans",monospace;box-shadow:0 4px 0 #0005;text-shadow:0 1px 0 #0006;min-height:52px}
.bmoves button small{display:block;font-weight:500;font-size:12px;opacity:.95}
.bmoves button:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.bmoves button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #0005}
.brow{display:flex;gap:8px;align-items:center}
.brow button{border:0;border-radius:8px;padding:8px 14px;font:700 15px "Pixelify Sans",monospace;background:#e6ecff;color:var(--ink)}
.brow .go{background:var(--ink);color:#fff}
.brow .tm{margin-left:auto;font-size:15px;color:#4a5690}
.bsw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bsw button{border:3px solid #c9d4f0;background:#fff;border-radius:10px;padding:4px;font:700 14px "Pixelify Sans",monospace;color:var(--ink)}
.bsw button img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto}
.bsw button small{display:block;font-weight:500;color:#4a5690}
.bsw button:disabled{opacity:.4}
@media (max-height:620px){.bmsg{min-height:0;font-size:16px}.bmoves button{min-height:44px;padding:6px 8px;font-size:15px}}
.msearch{width:100%;margin:0 0 10px;font:500 16px "Pixelify Sans",monospace;padding:8px 12px;border:3px solid #c9d4f0;border-radius:8px;background:#fff;color:var(--ink)}
.msearch:focus{outline:none;border-color:var(--ink)}
.mcard small{display:block;color:#4a5690;font-size:11px}
.mtabs{display:flex;gap:6px;margin:0 0 10px}
.mtabs button{flex:1;border:3px solid #c9d4f0;background:#fff;border-radius:8px;padding:7px;font:700 15px "Pixelify Sans",monospace;color:var(--ink)}
.mtabs button.on{border-color:var(--ink);background:#fff8dd}
.bt.pk .spot.me .mon{transform:none}
.bt.pk .spot.me .mon.lunge{animation:lungePk .35s}
.bt.pk .spot.me .mon.in{animation:pin .35s ease-out}
@keyframes lungePk{50%{transform:translate(18px,-10px)}}
/* a grama alta (public/vila/mato.js): o encontro com o Pokémon selvagem, a Pokébola e a Pokédex */
.selo{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--r);color:#fff;font:700 12px "Pixelify Sans",monospace;text-shadow:0 1px 0 #0006}
.bmoves .bola{background:#e8483b}.bmoves .fuga{background:#6a7690}.bmoves .dex{background:#2f6fd6}.bmoves .luta{background:#2f9a4a}
.dexgrid .xpbar{display:block;height:4px;margin:2px 4px 0;background:#d9def0;border-radius:2px;overflow:hidden}.dexgrid .xpbar i{display:block;height:100%;background:#3f8fe0}
.dexgrid .nv{position:absolute;top:2px;left:4px;font-size:10px;color:#4a5690}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px;max-height:min(52vh,420px);overflow:auto;padding:2px}
.dexgrid div{position:relative;border:3px solid var(--r);border-radius:8px;background:#fff;padding:2px 2px 4px;text-align:center;font:700 11px "Pixelify Sans",monospace;color:var(--ink)}
.dexgrid img{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto}
.dexgrid small{display:block;font-weight:500;color:#4a5690}.dexgrid b{position:absolute;top:2px;right:4px;font-size:11px}
.dexresumo{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;font:500 13px "Pixelify Sans",monospace}
.dexrank{margin:10px 0 0;padding-left:22px;font:500 14px "Pixelify Sans",monospace}

.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
/* O bairro inteiro cabe no minimapa. */
canvas.mini{position:fixed;inset:auto;right:14px;top:max(64px,calc(env(safe-area-inset-top) + 54px));width:144px;height:144px;border:3px solid #f8efdc;border-radius:12px;image-rendering:pixelated;background:#9fc486;pointer-events:none;z-index:2;box-shadow:0 5px 0 #375c56,0 10px 22px #15392b55}
canvas.mini.off{display:none}
@media (max-width:560px){canvas.mini{width:100px;height:100px}}
.fade.on{opacity:1}
/* central de batalha: os dois times lado a lado e quem está na vila para desafiar */
.tbtn.battle{background:linear-gradient(180deg,#ffcf3d,#f2a20c);color:#2a1a00;border-color:#fff3}
.bcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.bcard{background:#e6ecff;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bcard b{font-size:17px}.bcard span{font-size:14px;color:#4a5690;flex:1}
.bcard button,.blist button{border:0;border-radius:8px;padding:8px;font:700 15px "Pixelify Sans",monospace;background:var(--ink);color:#fff}
.blist{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.blist div{display:flex;align-items:center;gap:8px;background:#f2f5ff;border-radius:8px;padding:6px 8px}
.blist div b{flex:1}
@media (max-width:560px){.bcards{grid-template-columns:1fr}}
@media (max-width:560px){.tbtn .tx{display:none}.tbtn .tx.keep{display:inline}.brand small{font-size:11px}.brand h1{font-size:19px}.brand img{width:24px;height:28px}.dlg{font-size:15px}.dlg h2{font-size:19px}}
@media (max-width:560px){
  .top{flex-wrap:wrap;gap:6px;padding-inline:12px}
  .brand{flex:1;min-width:0}.brand h1{white-space:nowrap;letter-spacing:0}
  .tools{width:100%;gap:6px}.tbtn{flex:1;min-height:44px;padding:8px 6px;touch-action:manipulation}
  canvas.mini{top:max(128px,calc(env(safe-area-inset-top) + 118px))}
  .toasts{top:max(126px,calc(env(safe-area-inset-top) + 116px));max-width:calc(100% - 24px)}
  .toast{white-space:normal;text-align:center;max-width:100%}
}
@media (prefers-reduced-motion:reduce){.dlg,.fade{transition:none}}
/* Paulista Aberta: um parque de jogos e passeio, com interface leve sobre a cena. */
:root{--ink:#203a37;--paper:#fff9e9;--line:#3a7c75;--gold:#ffd561;--night:#203a37}
html,body{background:#80b795;color:var(--ink)}
.top{align-items:flex-start;padding:max(12px,env(safe-area-inset-top)) 14px 0}
.brand{background:#fff9e9f5;color:#203a37;border:2px solid #ffffff;border-radius:18px;box-shadow:0 5px 0 #28675966,0 9px 25px #17453a22;padding:8px 14px 8px 9px;gap:9px;backdrop-filter:none}
.brand img{width:30px;height:34px}
.avenida-label{display:block;color:#d85649;font:800 11px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.025em}
.brand h1{font:800 22px/.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.045em;margin:3px 0 0}
.brand h1 span{color:#203a37}
.brand small{color:#53746c;font-size:10px;margin-top:3px}.brand small b{color:#177a66}
.tools{gap:0;background:#fff9e9f5;border:2px solid #fff;border-radius:15px;box-shadow:0 5px 0 #28675966,0 9px 25px #17453a22;padding:3px}
.tbtn{background:transparent;color:#294842;border:0;border-radius:10px;box-shadow:none;font:700 14px Figtree,sans-serif;padding:9px 12px;min-height:37px;backdrop-filter:none}
.tbtn:hover{background:#e6f2dc;border:0}.tbtn.battle{background:#ffd561;color:#59421f;border:0;box-shadow:none}.tbtn.battle:hover{background:#ffe39b}
.hint{background:#fff9e9ed;color:#48625b;border:1px solid #fff;border-radius:11px;box-shadow:0 4px 0 #28675966;padding:5px 10px;bottom:14px;font:500 12px "Pixelify Sans",monospace}
.hint kbd{background:#d6e9dd;color:#284c42;box-shadow:none;border-radius:4px}
.toast{background:#fff9e9f2;color:#203a37;border:2px solid #fff;border-radius:9px;box-shadow:0 4px 0 #28675966}
.nick,.menu{background:#173e36b5}
.nick form,.menu .box,.dlg{background:#fff9e9;color:#203a37;border:3px solid #285d51;border-radius:16px;box-shadow:0 7px 0 #173d35,0 18px 42px #163d3566}
.nick p,.dlg .meta,.dlg .go span,.menu a small{color:#647f72}
.nick input{border-color:#3e7f70}.nick button,.dlg button,.menu .x{background:#287464;border-radius:8px;box-shadow:0 3px 0 #184a3d}
.menu h3{background:#277765;border-radius:6px;box-shadow:none;font-family:"Bricolage Grotesque",sans-serif;font-size:13px}
.menu a:hover,.menu a:focus-visible{background:#e2f2dd}
canvas.mini{width:132px;height:132px;background:#76ac83;border:3px solid #fff9e9;border-radius:13px;box-shadow:0 5px 0 #28675966,0 9px 25px #17453a22}
.dir button{background:#fff9e9eb;border:2px solid #66a185;color:#1d604e;border-radius:11px}
.ab button{background:#e66b55ef;border-color:#fff4d9}.ab .b{background:#438978ef;border-color:#fff4d9}
@media(max-width:560px){
  .top{flex-wrap:nowrap;align-items:flex-start;gap:6px;padding:8px 7px 0}
  .brand{flex:0 0 auto;min-width:0;padding:5px 7px 5px 5px;gap:5px;border-radius:12px}.brand img{width:21px;height:25px}.brand h1{font-size:15px;letter-spacing:-.06em}.brand small{font-size:9px;margin-top:1px}
  .avenida-label{font-size:8px}.tools{width:auto;flex:1;min-width:0;padding:2px;border-radius:11px}.tbtn{flex:1;min-width:0;min-height:39px;padding:4px 2px;font-size:16px}.tbtn .tx,.tbtn .tx.keep{display:none}
  canvas.mini{width:94px;height:94px;top:max(64px,calc(env(safe-area-inset-top) + 54px))}
  .toasts{top:63px}
}

<body>
<canvas id="cv" aria-hidden="true"></canvas>
<canvas id="mini" class="mini" width="64" height="64" aria-hidden="true"></canvas>

<header class="top">
  <div class="brand"><img src="/emblema.svg" alt=""><div><span class="avenida-label">Av. Paulista</span><h1>Vila da <span>Galera</span></h1><small id="online">conectando…</small></div></div>
  <div class="tools">
    <button class="tbtn" id="bNick" title="Trocar o nick">👤 <span class="tx" id="bNickTx">Nick</span></button>
    <button class="tbtn battle" id="bTeam" title="Batalhas de Galeramon, Pokémon ou Naruto Shippuden">⚔️<span class="tx keep"> Batalha</span></button>
    <button class="tbtn" id="bLook" title="Trocar a roupa do boneco">👕<span class="tx"> Roupa</span></button>
    <button class="tbtn" id="bMapa" title="Mostrar ou esconder o mapa">🗺️<span class="tx"> Mapa</span></button>
    <button class="tbtn" id="bMenu" title="Lista de jogos e salas abertas">☰<span class="tx"> Jogos</span><span class="badge" id="salasN" aria-label="salas abertas"></span></button>
  </div>
</header>

<div class="hint"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> andar · <kbd>Shift</kbd> correr · <kbd>Espaço</kbd> entrar · clique em uma casinha ou em um amigo</div>

<div class="dlg" id="dlg" role="status" aria-live="polite"></div>

<div class="pad dir" id="dpad">
  <button class="u" data-d="up" aria-label="Cima">▲</button>
  <button class="l" data-d="left" aria-label="Esquerda">◀</button>
  <button class="r" data-d="right" aria-label="Direita">▶</button>
  <button class="d" data-d="down" aria-label="Baixo">▼</button>
</div>
<div class="pad ab"><button class="b" id="bRun" aria-label="Correr">B</button><button id="bA" aria-label="Entrar">A</button></div>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuT"><div class="box"><h2 id="menuT">Para onde vamos?</h2><nav id="salasBox" aria-label="Salas abertas"></nav><nav id="menuList"></nav><button class="x" id="menuDex">🎒 Minha Pokédex</button><button class="x" id="menuX">Fechar</button></div></div>
<div class="nick" id="nick" role="dialog" aria-modal="true" aria-labelledby="nickT"><form id="nickF"><h2 id="nickT">Qual é o seu nick?</h2><p>É o nome que aparece em cima do seu boneco para a galera (até 8 letras).</p><input id="nickIn" maxlength="8" autocomplete="off" placeholder="Ex.: Kizzy" required><button>Entrar na vila</button></form></div>
<div class="menu" id="team" role="dialog" aria-modal="true" aria-labelledby="teamT"><div class="box wide"><h2 id="teamT">🐾 Seu time</h2><div class="mtabs" id="mtabs"></div><p style="font-size:15px;color:#4a5690" id="teamHelp"></p><input class="msearch" id="msearch" type="search" placeholder="Buscar por nome, número ou tipo (ex.: fogo)" autocomplete="off"><div class="mgrid" id="mgrid"></div><div class="minfo" id="minfo"></div><div class="row2"><button id="teamX">Fechar</button><button class="go" id="teamOk">Salvar time</button></div></div></div>
<div class="menu" id="pop" role="dialog" aria-modal="true"><div class="box" id="popBox"></div></div>
<div class="bt" id="bt" role="dialog" aria-modal="true" aria-label="Batalha por turnos">
  <div class="arena">
    <div class="ibox foe" id="ibFoe"></div>
    <div class="spot foe"><img class="mon" id="imFoe" alt=""><div class="plat"></div></div>
    <div class="spot me"><img class="mon" id="imMe" alt=""><div class="plat"></div></div>
    <div class="ibox me" id="ibMe"></div>
  </div>
  <div class="bpanel"><div class="bmsg" id="bmsg" aria-live="polite"></div><div id="bctl"></div></div>
</div>
<!-- o encontro na grama alta (public/vila/versus.css): o seu time de um lado, o Pokémon selvagem do outro, e as três ações -->
<div class="cap" id="cap" role="dialog" aria-modal="true" aria-label="Pokémon selvagem">
  <div class="cap-palco">
    <header class="cap-topo"><span class="cap-eyebrow">Encontro na grama alta</span><span id="capRaridade" class="cap-raridade"></span></header>
    <section class="cap-lado cap-meu" aria-label="Seu time"><h2 class="cap-titulo">Seu time</h2><div id="capTime" class="cap-time"></div></section>
    <div class="cap-vs" aria-hidden="true"><span>VS</span></div>
    <section class="cap-lado cap-selvagem" aria-label="Pokémon selvagem">
      <div class="cap-holofote"><img class="cap-mon" id="capMon" alt=""><i class="cap-base"></i></div>
      <div class="cap-ficha" id="capInfo"></div>
    </section>
  </div>
  <footer class="cap-acoes">
    <p class="cap-msg" id="capMsg" aria-live="polite"></p>
    <div class="cap-botoes">
      <button class="cap-bt luta" id="capLutar"><b>Lutar</b><small>no Ginásio · L</small></button>
      <button class="cap-bt bola" id="capBola"><b>Pokébola</b><small id="capChance">infinitas · Espaço</small></button>
      <button class="cap-bt fuga" id="capFugir"><b>Fugir</b><small>Esc</small></button>
    </div>
  </footer>
</div>
<!-- a Pokédex (public/vila/versus.css): o aparelho vermelho com a coleção, as raridades, a busca e o ranking -->

  <div id="dexBox" class="dex-corpo"></div>
</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="fade" id="fade"></div>

// ---------- desenho do mapa fixo (em pixels nativos, depois ampliado) ----------
function px(c, col, x, y, w = 1, h = 1) { c.fillStyle = col; c.fillRect(x, y, w, h); }

// O mapa é grande demais para um desenho só: ele é desenhado em pedaços de 32 x 32 casas, na hora em que aparecem na
// tela, e os pedaços que ficam muito tempo sem aparecer saem da memória.
const CH = 32, CHP = CH * TS;
const pedacos = new Map(), rascunho = document.createElement("canvas").getContext("2d");
const toca = (x0, y0, w, h, cx, cy, m = 1) => x0 - m < (cx + 1) * CH && x0 + w + m > cx * CH && y0 - m < (cy + 1) * CH && y0 + h + m > cy * CH;
function pedaco(cx, cy) {
  const chave = cx + "," + cy; let cv = pedacos.get(chave);
  if (cv) { pedacos.delete(chave); pedacos.set(chave, cv); return cv; }
  cv = document.createElement("canvas"); cv.width = cv.height = CHP;
  const c = cv.getContext("2d"); c.translate(-cx * CHP, -cy * CHP);
  const x0 = cx * CH, y0 = cy * CH, x1 = Math.min(MW, x0 + CH), y1 = Math.min(MH, y0 + CH);
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const t = ground[y][x];
    if (CHAO[t]) CHAO[t](c, x, y); else if (t === "l") drawTerra(c, x, y); else if (t === "m") drawMat(c, x, y); else if (t === "f") drawFlowers(c, x, y); else drawGrass(c, x, y);
  }
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (ground[y][x] === "t") drawTree(c, x, y);
  GAMES.forEach((g) => { if (toca(g.x, g.y, g.w, g.h, cx, cy)) drawBuilding(c, g); });
  TERRENOS.forEach((t) => { if (toca(t.x, t.y, t.w, t.h, cx, cy)) drawTerreno(c, t); });
  if (toca(FOUNTAIN.x, FOUNTAIN.y, FOUNTAIN.w, FOUNTAIN.h, cx, cy)) drawFountainBase(c);
  LAMPS.forEach(([x, y]) => { if (toca(x, y, 1, 1, cx, cy)) drawLampPost(c, x, y); });
  BENCHES.forEach(([x, y]) => { if (toca(x, y, 1, 1, cx, cy)) drawBench(c, x, y); });
  FOODTRUCKS.forEach((ft) => { if (toca(ft[0], ft[1], 3, 2, cx, cy)) drawFoodTruck(c, ft); });
  SEMAFOROS.forEach(([x, y]) => { if (toca(x, y - 1, 1, 2, cx, cy)) drawSemaforo(c, x, y); });
  if (toca(ANTENA.x, ANTENA.y - 7, 1, 8, cx, cy)) drawAntena(c);
  if (toca(PAINEL.x, PAINEL.y - 2, PAINEL.w, 3, cx, cy)) drawPainel(c);
  if (toca(OX + 33, OY + 14, 4, 2, cx, cy)) drawPlacaParque(c);
  pedacos.set(chave, cv);
  if (pedacos.size > 40) pedacos.delete(pedacos.keys().next().value);
  return cv;
}

function action() {
  if (player.moving || player.entering || btOpen()) return;
  if (here) return enter(here);
  const [dx, dy] = DIRS[player.dir], o = otherAt(player.x + dx, player.y + dy); // de frente para alguém
  if (o) openPlayer(o);
}

function bfs(sx, sy, tx, ty, ok = podePassar) {
  if (!ok(tx, ty)) return null;
  const W = MW, prev = new Map(), key = (x, y) => y * W + x, q = [[sx, sy]];
  let qi = 0;
  prev.set(key(sx, sy), null);
  while (qi < q.length) {
    const [x, y] = q[qi++];
    if (x === tx && y === ty) {
      const out = []; let k = key(x, y);
      while (k !== key(sx, sy)) { out.unshift([k % W, (k / W) | 0]); k = prev.get(k); }
      return out;
    }
    for (const [dx, dy] of Object.values(DIRS)) {
      const nx = x + dx, ny = y + dy, nk = key(nx, ny);
      if (ok(nx, ny) && !prev.has(nk)) { prev.set(nk, key(x, y)); q.push([nx, ny]); }
    }
  }

}
function tapAt(clientX, clientY) {
  if (player.entering) return;
  let tx, ty;
  { const wx = (clientX * dpr) / scale + camX, wy = (clientY * dpr) / scale + camY; tx = Math.floor(wx / TS); ty = Math.floor(wy / TS); }
  const o = otherAt(tx, ty) || otherAt(tx, ty + 1); // o boneco passa um pouco do tile de cima
  if (o) return openPlayer(o);
  const b = buildingAt(tx, ty);
  if (b) {
    if (here === b && !player.moving) return enter(b);
    const mat = b.mats.reduce((best, m) => (Math.abs(m[0] - player.x) < Math.abs(best[0] - player.x) ? m : best));
    const p = bfs(player.x, player.y, mat[0], mat[1]);
    if (p) { path = p; pathGoal = b; if (!p.length) { player.dir = "up"; } }
    return;

}

function tryMove(dir) {

  const [dx, dy] = DIRS[dir], nx = player.x + dx, ny = player.y + dy;
  if (!podePassar(nx, ny)) { sendPos(); return false; }
  player.from = [player.x, player.y]; player.x = nx; player.y = ny; player.moving = true; player.t = 0;
  setHere(null);

}
function arrive() {

  setHere(lugarEm(player.x, player.y));

}
function update(dt) {
  if (player.entering) {
    player.t = Math.min(1, player.t + dt / 260);
    return;

  if (player.moving) {
    player.t += dt / (running ? 80 : 150);
    if (player.t >= 1) { player.t = 1; arrive(); }
  }
  if (!player.moving) {
    const d = held[held.length - 1];
    if (d) tryMove(d);
    else if (path && path.length) {

      const dir = nx > player.x ? "right" : nx < player.x ? "left" : ny > player.y ? "down" : "up";
      if (!tryMove(dir)) path = null;

  const k = player.moving ? player.t : 1;
  player.fx = player.moving ? player.from[0] + (player.x - player.from[0]) * k : player.x;
  player.fy = player.moving ? player.from[1] + (player.y - player.from[1]) * k : player.y;
}

      if (o.t >= 1) { o.moving = false; o.steps++; o.t = 1; }

    o.fx = o.moving ? o.from[0] + (o.x - o.from[0]) * o.t : o.x;

  const spr = spritesFor(look)[dir + walkF];
  c.save();
  c.globalAlpha = alpha;
  px(c, "#00000040", Math.round(X) + 3, Math.round(Y) + 14, 10, 2);
  const bob = p.moving && walkF ? 1 : 0;
  if (p.dir === "right") { c.translate(Math.round(X) + 14, Math.round(Y) + bob); c.scale(-1, 1); c.drawImage(spr, 0, 0); }
  else c.drawImage(spr, Math.round(X) + 2, Math.round(Y) + bob);
  c.restore();
}
function drawTag(c, p, mine) { // nick em cima da cabeça
  if (!p.name || p.entering) return;
  c.font = '700 5px "Pixelify Sans", monospace';
  const label = p.busy ? "⚔️ " + p.name : p.name;
  const w = Math.ceil(c.measureText(label).width) + 4, x = Math.round(p.fx * TS + 8 - w / 2), y = Math.round(p.fy * TS) - 6;
  c.fillStyle = mine ? "#10183dd9" : "#000000a6"; c.fillRect(x, y, w, 7);
  c.fillStyle = mine ? "#ffe066" : "#ffffff"; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(label, x + w / 2, y + 3.8);
}
function drawBubble(c, t) {
  const p = player, X = p.fx * TS, Y = p.fy * TS;
  if (here && !p.moving && !p.entering) { // balão de "!" em cima da cabeça
    const by = Math.round(Y) - 18 + (Math.floor(t / 300) % 2);
    px(c, "#1b1b2f", X + 3, by - 1, 10, 10); px(c, "#ffffff", X + 4, by, 8, 8); px(c, "#1b1b2f", X + 7, by + 1, 2, 4); px(c, "#1b1b2f", X + 7, by + 6, 2, 1);
    px(c, "#1b1b2f", X + 7, by + 9, 2, 1);
  }
}
function drawDoorArrows(c, t) {
  const bob = Math.floor(t / 250) % 2;
  for (const g of GAMES) {
    if (g === here) continue;
    const d = Math.min(...g.mats.map(([mx, my]) => Math.abs(mx - player.x) + Math.abs(my - player.y)));
    if (d > 4) continue;
    const cx = Math.round((g.doors[0] + g.doors.length / 2) * TS), y = g.doorY * TS + TS + 2 + bob;
    px(c, "#1b1b2f", cx - 4, y - 1, 8, 1); px(c, "#ffe066", cx - 3, y, 6, 1); px(c, "#ffe066", cx - 2, y + 1, 4, 1); px(c, "#ffe066", cx - 1, y + 2, 2, 1);
  }
}

// ---------- a Paulista viva (a cada quadro) ----------
// Gente passeando na Paulista Aberta (calçadas e asfalto), bicicletas na ciclovia, um músico, o homem das bolhas, o
// vendedor de balões, pombos que voam quando alguém chega perto, a fumaça dos food trucks, os semáforos, o letreiro de LED,
// a luz da antena e as sombras das nuvens. Só enfeite: nada disso vai para o servidor nem bloqueia o caminho.
const reduzVida = matchMedia("(prefers-reduced-motion: reduce)");
const rndV = (() => { let s = 12345; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const FAIXAS_GENTE = [18.2, 19.1, 20.4, 21.2, 24.3, 25.1, 26.2, 27.1];
const PEDESTRES = Array.from({ length: 34 }, (_, i) => ({ fx: OX + 3 + rndV() * 84, fy: OY + FAIXAS_GENTE[i % FAIXAS_GENTE.length], vel: (0.7 + rndV() * 0.9) * (rndV() < 0.5 ? -1 : 1), look: (rndV() * 6) | 0, t: rndV(), steps: 0, moving: true, dir: "left", para: 0 }));
const CICLISTAS = Array.from({ length: 6 }, (_, i) => ({ fx: OX + 3 + rndV() * 84, fy: OY + (i % 2 ? 22.2 : 22.9) - 0.4, vel: (i % 2 ? 1 : -1) * (3 + rndV() * 1.5), look: (rndV() * 6) | 0, t: 0, steps: 0, moving: true, dir: i % 2 ? "right" : "left", bike: true }));
const ARTISTAS = [
  { tipo: "musico", fx: OX + 31, fy: OY + 18.4, look: 3, dir: "down", t: 0, steps: 0, moving: false },
  { tipo: "bolhas", fx: OX + 38, fy: OY + 20.6, look: 1, dir: "down", t: 0, steps: 0, moving: false },
  { tipo: "baloes", fx: OX + 43, fy: OY + 26.4, look: 4, dir: "down", t: 0, steps: 0, moving: false },
  { tipo: "musico", fx: OX + 63, fy: OY + 26.4, look: 0, dir: "down", t: 0, steps: 0, moving: false },
];
// os líderes e os treinadores, cada um ao lado da porta do próprio ginásio, olhando em volta de vez em quando
const DONOS = GAMES.filter((g) => g.lider).map((g, i) => ({ fx: g.doors[0] - 1.6, fy: g.doorY + 1.1, look: g.lider.look ?? (i % 6), dir: "down", t: 0, steps: 0, moving: false, fase: i * 1.3 }));
const POMBOS = Array.from({ length: 10 }, (_, i) => ({ x0: OX + 30 + rndV() * 10, y0: OY + 36.5 + rndV() * 5, x: 0, y: 0, voo: 0, vx: 0, vy: 0, fase: rndV() * 6 }));
POMBOS.forEach((p) => { p.x = p.x0; p.y = p.y0; });
const BOLHAS = [], NOTAS = [];
const NUVENS = Array.from({ length: 5 }, () => ({ x: rndV() * MW * TS, y: rndV() * MH * TS, rx: 70 + rndV() * 90, ry: 30 + rndV() * 30, v: 5 + rndV() * 6 }));
const LED_TEXTO = "  PAULISTA ABERTA  ·  VILA DA GALERA  ·  HOJE TEM TRUCO NO BOTECO  ·  CORRIDA EM NÜRBURGRING  ·  DESAFIE OS GINÁSIOS  ·  ";
// a gente e os ciclistas andam junto com os outros bonecos (entram na mesma ordem de desenho, por altura)
function passoVida(dt) {
  const s = dt / 1000, parado = reduzVida.matches;
  for (const p of [...PEDESTRES, ...CICLISTAS]) {
    if (parado) { p.moving = false; continue; }
    if (p.para > 0) { p.para -= s; p.moving = false; continue; }
    if (!p.bike && rndV() < s * 0.04) { p.para = 1 + rndV() * 3; continue; } // de vez em quando alguém para para olhar
    p.moving = true; p.fx += p.vel * s; p.dir = p.vel > 0 ? "right" : "left";
    p.t += Math.abs(p.vel) * s * 2; if (p.t >= 1) { p.t -= 1; p.steps++; }
    if (p.fx < OX + 2.5) { p.fx = OX + 2.5; p.vel = Math.abs(p.vel); } else if (p.fx > OX + VW - 3.5) { p.fx = OX + VW - 3.5; p.vel = -Math.abs(p.vel); }
  }
  // pombos: bicam o chão; quem chega perto (a menos de 2,5 casas) espanta e eles voam para longe, voltando depois
  for (const p of POMBOS) {
    if (p.voo > 0) { p.voo -= s; p.x += p.vx * s; p.y += p.vy * s; p.vy -= s * 2; if (p.voo <= 0) { p.x = p.x0; p.y = p.y0; } continue; }
    if (!parado && Math.hypot(player.fx - p.x, player.fy - p.y) < 2.5) { p.voo = 8; const a = Math.atan2(p.y - player.fy, p.x - player.fx) + (rndV() - 0.5); p.vx = Math.cos(a) * 5; p.vy = Math.sin(a) * 3 - 3; }
  }
  for (const n of NUVENS) { n.x += n.v * s * (parado ? 0 : 1); if (n.x - n.rx > MW * TS) n.x = -n.rx; }
  if (!parado) for (const d of DONOS) d.dir = ["down", "left", "down", "right"][Math.floor(performance.now() / 2200 + d.fase) % 4];
}
function personagemComBike(c, p) {
  const X = Math.round(p.fx * TS), Y = Math.round(p.fy * TS) + 9, giro = (p.steps + p.t) * 2;
  for (const dx of [2, 12]) { c.strokeStyle = "#1d1d22"; c.lineWidth = 1.4; c.beginPath(); c.arc(X + dx, Y + 4, 3.2, 0, 7); c.stroke(); px(c, "#9aa0a8", X + dx + Math.round(Math.cos(giro + dx) * 2), Y + 4 + Math.round(Math.sin(giro + dx) * 2), 1, 1); }
  px(c, "#e63946", X + 2, Y + 1, 10, 1); px(c, "#e63946", X + 7, Y - 1, 1, 3); px(c, "#2b2f37", X + (p.vel > 0 ? 11 : 2), Y - 2, 2, 1);
}
function drawVidaChao(c, t) {
  // as sombras das nuvens passando por cima de tudo (bem leves)
  if (!reduzVida.matches) { c.fillStyle = "#1a2a4012"; for (const n of NUVENS) { c.beginPath(); c.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(n.x + n.rx * 0.5, n.y - n.ry * 0.3, n.rx * 0.6, n.ry * 0.7, 0, 0, 7); c.fill(); } }
}
function drawVida(c, t) {
  const parado = reduzVida.matches;
  // artistas de rua
  for (const a of ARTISTAS) {
    const X = a.fx * TS, Y = a.fy * TS;
    if (a.tipo === "musico") {
      px(c, "#8a5a34", X + 9, Y + 8, 6, 5); px(c, "#c98a4b", X + 10, Y + 9, 4, 3); px(c, "#3a2414", X + 14, Y + 4, 1, 6); // o violão
      px(c, "#2b2f37", X - 6, Y + 12, 8, 4); px(c, "#ffd23f", X - 5, Y + 13, 6, 2); // o chapéu para as moedas
      if (!parado && Math.floor(t / 600 + a.fx) % 2 === 0 && NOTAS.filter((n) => n.a === a).length < 3) NOTAS.push({ a, x: X + 8, y: Y - 2, t: 0, s: rndV() < 0.5 ? "♪" : "♫" });
    } else if (a.tipo === "bolhas") {
      px(c, "#e8e8e8", X + 12, Y + 5, 1, 7); px(c, "#e8e8e8", X + 10, Y + 3, 5, 1);
      if (!parado && BOLHAS.length < 14 && rndV() < 0.08) BOLHAS.push({ x: X + 13, y: Y + 3, r: 2 + rndV() * 4, vx: 6 + rndV() * 10, vy: -8 - rndV() * 10, t: 0, vida: 2 + rndV() * 2 });
    } else if (a.tipo === "baloes") {
      ["#e53935", "#ffd23f", "#1e88e5", "#43a047", "#ff7ad9", "#fb8c00"].forEach((cor, i) => {
        const bx = X + 3 + (i % 3) * 5 + Math.sin(t / 700 + i) * 1.5, by = Y - 16 - (i >> 1) * 4 + Math.sin(t / 500 + i * 2) * 1.2;
        c.strokeStyle = "#ffffff99"; c.lineWidth = 0.5; c.beginPath(); c.moveTo(X + 9, Y + 6); c.lineTo(bx, by + 3); c.stroke();
        c.fillStyle = cor; c.beginPath(); c.ellipse(bx, by, 2.4, 3, 0, 0, 7); c.fill(); px(c, "#ffffff88", Math.round(bx) - 1, Math.round(by) - 2, 1, 1);
      });
    }
  }
  for (let i = NOTAS.length - 1; i >= 0; i--) { const n = NOTAS[i]; n.t += 0.016; if (n.t > 1.6) { NOTAS.splice(i, 1); continue; } c.globalAlpha = Math.max(0, 1 - n.t / 1.6); c.fillStyle = "#1b1b2f"; c.font = "8px system-ui, sans-serif"; c.fillText(n.s, n.x + Math.sin(n.t * 5) * 3, n.y - n.t * 14); c.globalAlpha = 1; }
  for (let i = BOLHAS.length - 1; i >= 0; i--) { const b = BOLHAS[i]; b.t += 0.016; if (b.t > b.vida) { BOLHAS.splice(i, 1); continue; } b.x += b.vx * 0.016; b.y += b.vy * 0.016 + Math.sin(b.t * 3) * 0.2; c.strokeStyle = `hsla(${(b.t * 120 + b.r * 40) % 360},80%,85%,${(1 - b.t / b.vida) * 0.9})`; c.lineWidth = 0.8; c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.stroke(); px(c, "#ffffffaa", Math.round(b.x - b.r * 0.4), Math.round(b.y - b.r * 0.4), 1, 1); }
  // pombos
  for (const p of POMBOS) {
    const X = Math.round(p.x * TS + 8), Y = Math.round(p.y * TS + 10), bica = p.voo > 0 ? 0 : (Math.sin(t / 180 + p.fase) > 0.6 ? 1 : 0);
    if (p.voo > 0) { const asa = Math.sin(t / 60 + p.fase) > 0 ? -2 : 1; px(c, "#8a8f99", X - 3, Y + asa, 3, 1); px(c, "#8a8f99", X + 2, Y + asa, 3, 1); px(c, "#6d727c", X - 1, Y, 3, 2); }
    else { px(c, "#00000025", X - 2, Y + 3, 5, 1); px(c, "#8a8f99", X - 2, Y, 4, 3); px(c, "#5d6b82", X + (bica ? 2 : 1), Y - 1 + bica, 2, 2); px(c, "#e2a24a", X + (bica ? 4 : 3), Y + bica, 1, 1); }
  }
  // fumaça dos food trucks e da chaminé da Cozinha
  const coz = GAMES.find((g) => g.restaurante);
  if (!parado && coz) for (let k = 0; k < 4; k++) { const f = ((t / 2200 + k / 4) % 1), X = (coz.x * TS - 3) + Math.round((coz.w * TS + 6) * 0.8) + 4 + Math.sin(f * 5 + k) * 4, Y = coz.y * TS - 8 - f * 26; c.fillStyle = `rgba(235,235,235,${0.5 * (1 - f)})`; c.beginPath(); c.arc(X, Y, 2.5 + f * 5, 0, 7); c.fill(); }
  if (!parado) for (const [x, y] of FOODTRUCKS) for (let k = 0; k < 3; k++) { const f = ((t / 1800 + k / 3 + x * 0.1) % 1), X = x * TS + 34 + Math.sin(f * 6 + k) * 3, Y = y * TS + 2 - f * 18; c.fillStyle = `rgba(240,240,240,${0.45 * (1 - f)})`; c.beginPath(); c.arc(X, Y, 2 + f * 4, 0, 7); c.fill(); }
  // semáforos: verde para o pedestre por 4 s, piscando vermelho por 1 s e vermelho por 3 s
  const ciclo = (t / 1000) % 8, verde = ciclo < 4, pisca = ciclo >= 4 && ciclo < 5;
  for (const [x, y] of SEMAFOROS) { const X = x * TS, Y = y * TS; px(c, verde ? "#3ee07a" : "#20402a", X + 6, Y - 10, 4, 3); px(c, !verde && (!pisca || Math.floor(t / 250) % 2) ? "#ff4b3a" : "#40201c", X + 6, Y - 6, 4, 3); }
  // o letreiro de LED correndo
  { const X = PAINEL.x * TS + 3, Y = PAINEL.y * TS - 15, W = PAINEL.w * TS - 6; c.save(); c.beginPath(); c.rect(X, Y, W, 18); c.clip();
    c.font = '700 11px "Pixelify Sans", monospace'; c.textBaseline = "middle"; const larg = c.measureText(LED_TEXTO).width, desl = parado ? 0 : (t / 30) % larg;
    for (const k of [0, 1]) { c.fillStyle = ["#ffd23f", "#5fe6ff", "#ff7ad9"][Math.floor(t / 2500) % 3]; c.fillText(LED_TEXTO, X - desl + k * larg, Y + 9.5); }
    c.restore(); }
  // a luz vermelha no alto da antena
  if (Math.floor(t / 700) % 2) { const X = ANTENA.x * TS + 8, Y = ANTENA.y * TS + 15 - 97; c.fillStyle = "#ff3b2f"; c.beginPath(); c.arc(X, Y, 2, 0, 7); c.fill(); c.fillStyle = "#ff3b2f33"; c.beginPath(); c.arc(X, Y, 5, 0, 7); c.fill(); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last), lastRaw = now - last; last = now;
  update(dt);
  updateOthers(dt);
  passoVida(dt);
  const mw = MW * TS, mh = MH * TS;
  const tx = player.fx * TS + 8 - viewW / 2;
  const mobileFocus = Math.max(.5, .63 - Math.max(0, player.fy - (OY + 22)) * .013);
  const desktopFocus = Math.max(.5, .56 - Math.max(0, player.fy - (OY + 22)) * .006);
  const ty = player.fy * TS + 8 - viewH * (innerWidth <= 560 ? mobileFocus : desktopFocus);
  camX = mw > viewW ? Math.max(0, Math.min(mw - viewW, tx)) : (mw - viewW) / 2;
  camY = mh > viewH ? Math.max(0, Math.min(mh - viewH, ty)) : (mh - viewH) / 2;
  camX = Math.round(camX * scale) / scale; camY = Math.round(camY * scale) / scale;
  // durante a batalha a vila fica escondida: não desenha nada (poupa bateria e memória do celular)
  if (btOpen()) { requestAnimationFrame(frame); return; }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#78b58b"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, -camX * scale, -camY * scale);
  ctx.imageSmoothingEnabled = false;
  for (let cy = Math.floor(camY / CHP); cy <= Math.floor((camY + viewH) / CHP); cy++) for (let cx = Math.floor(camX / CHP); cx <= Math.floor((camX + viewW) / CHP); cx++)
    if (cx >= 0 && cy >= 0 && cx * CH < MW && cy * CH < MH) ctx.drawImage(pedaco(cx, cy), cx * CHP, cy * CHP);
  drawFountainWater(ctx, now);
  drawTelao(ctx, now);
  GAMES.forEach((g) => { if (g.casino) drawCasinoBulbs(ctx, g, now); });
  if (player.entering) { // a porta abre
    const g = player.entering;
    for (const d of g.doors) px(ctx, "#140c06", d * TS + (g.doors.length > 1 ? (d === g.doors[0] ? 2 : 0) : 2), g.doorY * TS + TS - 20, g.doors.length > 1 ? 14 : 12, 19);
  }
  drawDoorArrows(ctx, now);
  player.name = myName;
  const chars = [...others.values()].filter(naMinhaZona).map((o) => [o, o.look]);
  chars.push([player, outfit]);
  for (const p of [...PEDESTRES, ...CICLISTAS, ...ARTISTAS, ...DONOS]) chars.push([p, p.look]); // a gente da Paulista Aberta e os donos dos ginásios
  chars.sort((a, b) => a[0].fy - b[0].fy);
  chars.forEach(([p, look]) => { if (p.bike) personagemComBike(ctx, p); drawChar(ctx, p, look); if (ground[Math.round(p.fy)]?.[Math.round(p.fx)] === "h") drawMatoPorCima(ctx, p); });
  drawVida(ctx, now);
  drawVidaChao(ctx, now);
  drawLampFlames(ctx, now);
  GAMES.forEach((g) => drawSign(ctx, g, now));
  BAIRROS.forEach((b) => drawPlaca(ctx, b));
  chars.forEach(([p]) => drawTag(ctx, p, p === player));
  drawBubble(ctx, now);
  drawMini(now);
  requestAnimationFrame(frame);
}

GAMES.filter((g) => !g.npc).forEach((g) => drawBuilding(rascunho, g)); // só para saber onde ficam as janelas (as luzes da noite)
resize();
$("mini").classList.toggle("off", !miniOn);
$("bMapa").onclick = () => { miniOn = !miniOn; $("mini").classList.toggle("off", !miniOn); $("bMapa").blur(); };
setHere(lugarEm(player.x, player.y));
requestAnimationFrame(frame);
buscarEstante(); setInterval(buscarEstante, 60e3);
if (location.hash === "#debug") window.__vila = {
  GAMES, player, others, ground, solid, walkable, bfs, TELAO, ESTANTE, TERRENOS,
  get here() { return here; }, get myId() { return myId; },
  get camera() { return { x: camX, y: camY, scale: scale / dpr, tile: TS }; },
};
document.fonts && document.fonts.load('700 10px "Pixelify Sans"');
</script>
