<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vila 3D — protótipo</title>
<script src="/semzoom.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #86c6f0; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #voltar { position: fixed; top: 10px; left: 10px; z-index: 3; background: #0d1022; color: #fff; padding: 7px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; }
  #dica { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); background: #0d1022cc; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 13px; z-index: 3; white-space: nowrap; }
  #cartao { position: fixed; right: 12px; bottom: 12px; z-index: 3; background: #0d1022; color: #fff; border-radius: 12px; padding: 12px 14px; max-width: 260px; display: none; }
  #cartao b { display: block; font-size: 16px; margin-bottom: 8px; }
  #cartao a { display: inline-block; background: #ffd54a; color: #1a1a1a; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
  #carregando { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; z-index: 5; background: #0d1022; }
</style>
</head>
<body>
<a id="voltar" href="/">← Vila</a>
<div id="dica">Arraste para girar · roda/pinça para o zoom · toque num prédio</div>
<div id="cartao"><b id="cNome"></b><a id="cIr" href="#">Entrar</a></div>
<div id="carregando">Montando a Vila…</div>
<script src="dados.js"></script>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }</script>
<script type="module" src="jogo.js"></script>
</body>
</html>
