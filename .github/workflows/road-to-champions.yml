name: Road to Champions tests
on:
  pull_request:
    paths:
      - "road-to-champions.js"
      - "public/jogador/**"
      - "tests/road-to-champions.test.js"
      - "package.json"
      - "bd.js"
      - "migracoes/**"
      - "server.js"
      - ".github/workflows/road-to-champions.yml"
  push:
    branches: [main]
    paths:
      - "road-to-champions.js"
      - "public/jogador/**"
      - "tests/road-to-champions.test.js"
      - "package.json"
      - "bd.js"
      - "migracoes/**"
      - "server.js"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check road-to-champions.js && node --check public/jogador/road.js
      - run: node --test tests/road-to-champions.test.js
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: node --check road-to-champions.js && node --check public/jogador/road.js
      - run: node --test tests/road-to-champions.test.js
      - run: npm test
