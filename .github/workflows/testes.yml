name: Testes
# Roda o npm test (os testes do servidor e das regras) em todo PR e em todo push na main.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm test
